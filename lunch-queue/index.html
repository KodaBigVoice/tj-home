<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchday Queues</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#F3F1EC;color:#141B2D;font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.sg{font-family:"Space Grotesk",Inter,sans-serif}
svg{flex:none}

/* title bar */
header.top{background:#333A47;color:#fff;padding:14px 32px;display:flex;flex-wrap:wrap;align-items:center;gap:16px;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 auto;font:700 21px "Space Grotesk",Inter,sans-serif;letter-spacing:-.2px}
nav.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.hbtn{height:40px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;font:500 14px Inter,sans-serif;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.14)}
.hbtn.icon{width:40px;padding:0;justify-content:center}
.hbtn:disabled{opacity:.4;cursor:default;background:rgba(255,255,255,.06)}
.hbtn.export{background:#2E6E6E;border-color:#2E6E6E;font-weight:600;padding:0 12px 0 16px}
.hbtn.export:hover{background:#357d7d}
.hbtn.open{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.16)}
.status{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.72);font-size:13px;margin-right:6px;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:#4CC38A;flex:none}
.dot.man{background:#E9B54A}
.vsep{width:1px;height:26px;background:rgba(255,255,255,.2)}

/* layout */
.wrap{max-width:1440px;margin:0 auto;padding:22px 32px 48px}
.dayrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:22px}
.dayswitch{display:flex;background:#E6E2D8;border-radius:17px;padding:5px;gap:4px;margin-left:108px}
.dayswitch button{height:52px;padding:0 26px;border:0;border-radius:12px;background:transparent;color:#4F5664;font:500 17px "Space Grotesk",Inter,sans-serif;cursor:pointer}
.dayswitch button.on{background:#fff;color:#141B2D;font-weight:600;box-shadow:0 1px 3px rgba(20,27,45,.12)}
.dayswitch button:disabled{opacity:.4;cursor:default}
.lbtn{height:44px;padding:0 16px;border-radius:12px;border:1px solid #D8D3C8;background:#fff;color:#141B2D;font:500 14px Inter,sans-serif;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.lbtn:hover{border-color:#B9B2A4}
.lbtn.on{background:#333A47;border-color:#333A47;color:#fff}
.lbtn:disabled{opacity:.45;cursor:default}
.layout{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.board{flex:999 1 760px;min-width:0;display:flex;flex-direction:column;gap:12px}
.grow{display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,1fr);gap:12px}
.dh{border-radius:14px;height:52px;padding:0 18px;display:flex;align-items:center;font:700 18px "Space Grotesk",Inter,sans-serif;color:#fff}
.dh.art{background:#2E6E6E}.dh.chapel{background:#333A47}
.tcol{display:flex;flex-direction:column;gap:2px;padding:12px 0 0 4px}
.tcol b{font:700 34px "Space Grotesk",Inter,sans-serif;letter-spacing:-.5px;line-height:1}
.tcol span{font:600 12px Inter,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:#5E6573;margin-top:6px}
.cell{border-radius:26px;padding:10px;min-height:200px;display:flex;flex-direction:column}
.cell.art{background:#E1EEED}.cell.chapel{background:#E8E9EC}
.count{align-self:flex-end;font:600 12px Inter,sans-serif;background:#fff;border-radius:999px;padding:3px 10px}
.cell.art .count{color:#2E6E6E}.cell.chapel .count{color:#333A47}
.count.over{background:#B42318;color:#fff !important}
.emptyhint{color:#7A808C;font-size:13px;text-align:center;padding:26px 8px;border:1.5px dashed rgba(51,58,71,.2);border-radius:16px;margin-top:4px}

/* gaps between tiles */
.gap{height:8px;position:relative;flex:none}
body.dragging .gap::after{content:"";position:absolute;left:8px;right:8px;top:2px;height:4px;border-radius:4px;background:rgba(51,58,71,.18)}
body.dragging .gap{height:12px}
body.dragging .gap.last{flex:1 0 12px;min-height:12px}
.gap.on{height:66px !important}
.gap.on::after{display:none}
.gapin{display:none}
.gap.on .gapin{display:flex;position:absolute;left:0;right:0;top:4px;height:58px;border:2px dashed #333A47;border-radius:16px;background:rgba(255,255,255,.75);align-items:center;justify-content:center;gap:8px;font:600 14px Inter,sans-serif;color:#141B2D}

/* tiles */
.tile{background:#fff;border-radius:16px;border:1px solid #E2DED5;box-shadow:0 1px 2px rgba(20,27,45,.08),0 4px 12px rgba(20,27,45,.08);display:flex;align-items:stretch;overflow:hidden;transition:opacity .12s,box-shadow .12s}
body.dragging .tile.nojoin{opacity:.4}
body.dragging .tile.canjoin{box-shadow:0 0 0 2px rgba(46,110,110,.35),0 4px 12px rgba(20,27,45,.08)}
body.dragging .tile.canjoin.over{box-shadow:0 0 0 3px #2E6E6E,0 0 0 7px rgba(46,110,110,.18)}
.tlab{flex:none;width:46px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.rot{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 0;text-align:center}
.rot b{font:700 11px Inter,sans-serif;letter-spacing:1.6px;text-transform:uppercase}
.rot i{font:700 14px "Space Grotesk",Inter,sans-serif;font-style:normal;letter-spacing:.4px}
.chips{flex:1;padding:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.chip{border:1px solid;border-radius:8px;padding:5px 10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.chip .cn{display:flex;align-items:center;gap:4px;font:600 13.5px Inter,sans-serif;white-space:nowrap}
.chip .ct{display:flex;align-items:center;gap:3px;font:500 11.5px Inter,sans-serif;color:#4F5664;min-height:13px}
.alltag{align-self:stretch;border-radius:8px;width:24px;min-height:42px;display:flex;align-items:center;justify-content:center}
.alltag span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 10.5px Inter,sans-serif;letter-spacing:1.2px;text-transform:uppercase}
.g-Boys .tlab,.g-Boys .alltag{background:#DDE8F7;color:#244677}
.g-Girls .tlab,.g-Girls .alltag{background:#F7E1EB;color:#84305B}
.g-Other .tlab,.g-Other .alltag{background:#E7E8EB;color:#3D4452}
.chip.g-Boys{background:#EEF3FB;border-color:#CFDCF0}
.chip.g-Girls{background:#FBEFF4;border-color:#EED0DD}
.chip.g-Other{background:#F3F4F6;border-color:#DADDE2}
.chip.man{border-style:dashed}
.chip.flag{background:#FCEBC7 !important;border-color:#E3B04F !important}
.chip:hover{filter:brightness(.97)}
.dragsrc{opacity:.3}
.ghost{position:fixed;pointer-events:none;z-index:200;transform:rotate(-3deg);box-shadow:0 12px 24px rgba(20,27,45,.25);opacity:.96}
body.hide-mode .chip,body.hide-mode .tlab{cursor:crosshair}
body.hide-mode .chip:hover{background:#FDE7E7 !important;border-color:#B42318 !important}
body.hide-mode .tile:hover{box-shadow:0 0 0 2px #B42318}
.hidebar{display:none;align-items:center;gap:12px;background:#FFF4E5;border:1px solid #F0C27A;color:#6B3D00;border-radius:12px;padding:10px 14px;margin:-8px 0 14px}
body.hide-mode .hidebar{display:flex}

/* side */
.side{flex:1 1 320px;max-width:380px;display:flex;flex-direction:column;gap:16px}
.panel{background:#fff;border-radius:26px;border:1px solid #E2DED5;padding:16px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ph h2{margin:0;flex:1;font:700 17px "Space Grotesk",Inter,sans-serif}
.badge{font:600 12px Inter,sans-serif;background:#FCEBC7;color:#8A4205;border-radius:999px;padding:3px 10px}
.badge.ok{background:#E3F1E8;color:#2E6B45}
.list{display:flex;flex-direction:column;gap:8px}
.fitem{display:flex;gap:12px;align-items:flex-start;background:#FDF6E7;border:1px solid #F1D9A6;border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13.5px;line-height:1.45}
.fitem.done{background:#F7F5F0;border-color:#E2DED5;color:#5E6573}
.fitem input{width:20px;height:20px;margin:1px 0 0;accent-color:#333A47;flex:none;cursor:pointer}
.info{color:#5E6573;font-size:12.5px;line-height:1.45;margin:2px 0 0}
.muted{color:#5E6573;font-size:13px;line-height:1.45;margin:0}
.coll{margin-top:10px;width:100%;height:38px;border-radius:10px;border:1px solid #E2DED5;background:#F7F5F0;color:#3D4452;font:500 13px Inter,sans-serif;display:flex;align-items:center;gap:8px;padding:0 12px;cursor:pointer}
.coll .grow1{flex:1;text-align:left}
.coll .sh{display:flex;align-items:center;gap:4px;color:#5E6573}
.sub{margin-top:8px}
.hbox{border-radius:12px;min-height:40px;transition:background .12s}
.hbox.over{background:#FFF8EA;box-shadow:0 0 0 2px #E39B1B}
.hrow{display:flex;align-items:center;gap:10px;background:#F3F1EC;border-radius:10px;padding:6px 6px 6px 12px;cursor:grab;touch-action:none;user-select:none}
.hrow .t{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.hrow .t b{font-weight:600}
.hrow .t span{font-size:12px;color:#5E6573}
.sbtn{height:32px;padding:0 12px;border-radius:4px;border:1px solid #D8D3C8;background:#fff;color:#141B2D;font:500 13px Inter,sans-serif;cursor:pointer;flex:none}
.ubtn{height:34px;padding:0 12px;border-radius:8px;border:1px solid #D8D3C8;background:#fff;color:#141B2D;font:500 13px Inter,sans-serif;cursor:pointer}
.ubtn:disabled{opacity:.4;cursor:default}

/* menus */
.menu{position:fixed;z-index:60}
.menu[hidden]{display:none !important}
.menu.file{width:230px;background:#fff;border-radius:18px;border:1px solid #E2DED5;box-shadow:0 18px 40px rgba(20,27,45,.18);padding:8px;display:flex;flex-direction:column;gap:2px}
.mi{height:44px;border:0;border-radius:10px;background:transparent;color:#141B2D;font:500 14px Inter,sans-serif;display:flex;align-items:center;gap:10px;padding:0 12px;cursor:pointer;text-align:left}
.mi:hover{background:#F3F1EC}
.menu.export{width:320px;background:#2E6E6E;color:#fff;border-radius:26px;padding:16px;box-shadow:0 18px 40px rgba(20,27,45,.3);display:flex;flex-direction:column;gap:10px}
.prev{background:#fff;border-radius:10px;overflow:hidden;min-height:60px;display:flex;align-items:center;justify-content:center;color:#5E6573;font-size:12px}
.prev img{width:100%;display:block}
.eb1{height:44px;border:0;border-radius:10px;background:#fff;color:#2E6E6E;font:600 14px Inter,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.eb2{height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;font:500 14px Inter,sans-serif;cursor:pointer}
.eb2:hover{background:rgba(255,255,255,.08)}

/* edit card */
.pop{position:fixed;z-index:70;width:380px;max-width:calc(100vw - 24px);background:#fff;border-radius:26px;border:1px solid #E2DED5;box-shadow:0 18px 40px rgba(20,27,45,.2);padding:16px;display:flex;flex-direction:column;gap:14px}
.pop[hidden]{display:none !important}
.pop h3{margin:0;flex:1;font:700 18px "Space Grotesk",Inter,sans-serif}
.poph{display:flex;align-items:center;gap:10px;padding:4px 4px 0}
.poph span{font-size:12.5px;color:#5E6573;max-width:200px;text-align:right}
.seg{display:flex;background:#F3F1EC;border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;height:38px;border:0;border-radius:7px;background:transparent;color:#4F5664;font:500 13.5px Inter,sans-serif;cursor:pointer}
.seg button.on{font-weight:600}
.seg button.on.v-Boys{background:#DDE8F7;color:#244677}
.seg button.on.v-Girls{background:#F7E1EB;color:#84305B}
.seg button.on.v-Other{background:#E7E8EB;color:#3D4452}
.seg button.on.v-dark{background:#333A47;color:#fff}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#4F5664}
.fld input{height:44px;border-radius:10px;border:1px solid #D8D3C8;padding:0 12px;font:600 16px Inter,sans-serif;color:#141B2D;background:#fff;width:100%}
.fld input.tm{font-family:"Space Grotesk",Inter,sans-serif}
.popf{display:flex;align-items:center;gap:8px}
.del{height:44px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:#A32D2D;font:600 14px Inter,sans-serif;display:flex;align-items:center;gap:6px;cursor:pointer}
.b2{height:44px;padding:0 16px;border-radius:10px;border:1px solid #D8D3C8;background:#fff;color:#141B2D;font:500 14px Inter,sans-serif;cursor:pointer}
.b1{height:44px;padding:0 20px;border-radius:10px;border:0;background:#333A47;color:#fff;font:600 14px Inter,sans-serif;cursor:pointer}

/* settings */
.modal{position:fixed;inset:0;background:rgba(20,27,45,.4);display:none;align-items:flex-start;justify-content:center;z-index:80;padding:32px 16px;overflow:auto}
.modal.open{display:flex}
.sheet{width:100%;max-width:824px;background:#fff;border-radius:40px;border:1px solid #E2DED5;box-shadow:0 20px 50px rgba(20,27,45,.2);padding:28px;display:flex;flex-direction:column;gap:26px}
.sheet h1{margin:0;flex:1;font:700 26px "Space Grotesk",Inter,sans-serif;letter-spacing:-.3px}
.sheet h2{margin:0;font:600 12px Inter,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:#5E6573}
.sec{display:flex;flex-direction:column;gap:12px}
.close{width:44px;height:44px;border-radius:12px;border:0;background:#F3F1EC;color:#141B2D;display:flex;align-items:center;justify-content:center;cursor:pointer}
.termrow{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.term{flex:none;width:210px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:#4F5664}
.term select{height:46px;border-radius:12px;border:1px solid #D8D3C8;background:#fff;padding:0 12px;font:600 15px Inter,sans-serif;color:#141B2D}
.sports{flex:1;min-width:300px;background:#F7F5F0;border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px}
.sprow{display:grid;grid-template-columns:110px minmax(0,1fr) auto auto;gap:8px;align-items:center;border-radius:10px;padding:6px 6px 6px 14px}
.sprow.r-Boys{background:#EEF3FB}.sprow.r-Girls{background:#FBEFF4}.sprow.r-Other{background:#F3F4F6}
.sprow .gl{font-weight:700}
.sprow.r-Boys .gl{color:#244677}.sprow.r-Girls .gl{color:#84305B}.sprow.r-Other .gl{color:#3D4452}
.sprow input[type=text]{height:38px;border-radius:4px;border:1px solid #E2DED5;padding:0 12px;font:500 15px Inter,sans-serif;background:#fff;color:#141B2D;width:100%}
.sprow.r-Boys input[type=text]{border-color:#CFDCF0}.sprow.r-Girls input[type=text]{border-color:#EED0DD}
.sprow select{height:38px;border-radius:4px;border:1px solid #D8D3C8;background:#fff;padding:0 8px;font:600 13.5px Inter,sans-serif}
.tog78{height:38px;padding:0 12px;border-radius:4px;border:0;background:rgba(255,255,255,.7);color:#4F5664;font:600 13px Inter,sans-serif;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.tog78.on{background:#E1EEED;color:#275F5F}
.rm{width:38px;height:38px;border-radius:4px;border:0;background:transparent;color:#7A808C;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rm:hover{background:rgba(0,0,0,.05)}
.addsp{align-self:flex-start;height:38px;padding:0 14px;border-radius:10px;border:1px dashed #BFB8A9;background:transparent;color:#3D4452;font:500 13.5px Inter,sans-serif;display:flex;align-items:center;gap:6px;cursor:pointer}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.drow{display:flex;align-items:center;gap:10px}
.drow>span{flex:1;font-weight:500}
.dseg{display:flex;background:#F3F1EC;border-radius:11px;padding:3px;gap:2px}
.dseg button{height:36px;width:64px;border:0;border-radius:8px;background:transparent;color:#4F5664;font:600 13px Inter,sans-serif;cursor:pointer}
.dseg button.e{width:56px;font-weight:500}
.dseg button.on.art{background:#2E6E6E;color:#fff}.dseg button.on.chapel{background:#333A47;color:#fff}.dseg button.on.e{background:#fff;color:#141B2D;font-weight:600}
.qbox{background:#F7F5F0;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.qbox .top{display:flex;align-items:baseline;justify-content:space-between}
.qbox .top b{font:700 24px "Space Grotesk",Inter,sans-serif}
.qbox input[type=range]{width:100%;accent-color:#333A47}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#4F5664}
.fl input{height:42px;border-radius:10px;border:1px solid #D8D3C8;padding:0 10px;font:600 16px "Space Grotesk",Inter,sans-serif;color:#141B2D;width:100%}
.dn{display:flex;align-items:center;gap:8px;height:42px;border-radius:10px;border:1px solid #D8D3C8;padding:0 10px}
.dn i{width:14px;height:14px;border-radius:4px;flex:none}
.dn input{border:0;flex:1;min-width:0;font:500 15px Inter,sans-serif;color:#141B2D;outline:none;height:38px;padding:0}
.togs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.trow{display:flex;align-items:center;gap:14px;background:#F7F5F0;border-radius:12px;padding:12px 14px;cursor:pointer}
.trow .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.trow .tx b{font-weight:600}
.trow .tx span{font-size:12.5px;color:#5E6573;line-height:1.35}
.sw{flex:none;width:46px;height:28px;border-radius:999px;border:0;background:#CFC9BC;padding:3px;display:flex;justify-content:flex-start;cursor:pointer}
.sw.on{background:#333A47;justify-content:flex-end}
.sw i{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.foot{display:flex;justify-content:flex-end;gap:10px;padding-top:4px}
.foot .b2,.foot .b1{height:46px;border-radius:12px}

/* welcome */
.welcome{max-width:640px;margin:60px auto;background:#fff;border:1px solid #E2DED5;border-radius:30px;padding:36px;text-align:center}
.welcome h1{margin:0 0 8px;font:700 30px "Space Grotesk",Inter,sans-serif}
.welcome p{color:#5E6573;line-height:1.5;margin:0}
.dz{border:2px dashed #BFB8A9;border-radius:18px;padding:30px;margin:22px 0;cursor:pointer;color:#141B2D;background:#F7F5F0}
.dz:hover,.dz.over{border-color:#2E6E6E;background:#EEF5F4}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#333A47;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:.2s;z-index:120;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:900px){.dayswitch{margin-left:0}.wrap{padding:16px}header.top{padding:12px 16px}.grow{grid-template-columns:64px minmax(0,1fr) minmax(0,1fr);gap:8px}.tcol b{font-size:24px}.cols,.togs{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="4" width="13" height="26" rx="4" fill="#4C9C99"/><rect x="19" y="4" width="13" height="26" rx="4" fill="#8E97A7"/><rect x="5" y="9" width="7" height="3" rx="1.5" fill="#fff"/><rect x="5" y="15" width="7" height="3" rx="1.5" fill="#fff"/><rect x="22" y="9" width="7" height="3" rx="1.5" fill="#fff"/></svg>
    Matchday Queues
  </div>

function toMin24(s){if(!s)return null;const m=String(s).trim().match(/^(\d{1,2})[:.](\d{2})/);return m?(+m[1])*60+(+m[2]):null;}
function toMin(s){if(!s)return null;const m=String(s).trim().match(/^(\d{1,2})[:.](\d{2})/);if(!m)return null;let h=+m[1];if(h<8)h+=12;return h*60+(+m[2]);}
function fmt(m){if(m==null||m>=9999)return '';return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseDate(s){s=(s||'').trim();let m=s.match(/(\d{1,2})\s+([A-Za-z]{3})[A-Za-z]*\.?\s+(\d{4})/);
  if(m){const mi=MON.indexOf(m[2].toLowerCase());if(mi>=0)return new Date(+m[3],mi,+m[1]);}
  m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]);}
  m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);return null;}
function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),ms||2600);}
function doorName(d){return S.settings.doorNames[d]||d;}
function parseCSV(text){const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==''));}
function groupBy(list,f){const m=new Map();for(const e of list){const k=f(e);if(!m.has(k))m.set(k,[]);m.get(k).push(e);}return [...m.values()];}

/* ============ team parsing ============ */
function allSports(){return [...S.settings.sports,...S.settings.extraSports].filter(x=>x.name&&x.name.trim());}
function matchSports(sport){const s=(sport||'').trim().toLowerCase();if(!s)return [];const L=allSports();
  let m=L.filter(x=>x.name.trim().toLowerCase()===s);if(!m.length)m=L.filter(x=>s.includes(x.name.trim().toLowerCase()));return m;}
function annotate(e){
  let s=e.raw.trim().replace(/\s+/g,' ');let gender=null;
  let m=s.match(/^(boys|girls|mixed)\b[\s\-–]*/i);
  if(m){gender=m[1][0].toUpperCase()+m[1].slice(1).toLowerCase();s=s.slice(m[0].length);}
  let age=null,ageExplicit=false;
  m=s.match(/(^|[\s\-])U\s?(\d{1,2})(?=[A-Za-z\s]|$)/i);
  if(m){age=+m[2];ageExplicit=true;s=s.slice(0,m.index)+' '+s.slice(m.index+m[0].length);}
  s=s.replace(/\bteam\b/ig,'').replace(/\s+/g,' ').trim();
  const sp=matchSports(e.sport);
  e.sportKey=sp.length?sp[0].name.trim():(e.sport||'').trim();
  if(!gender&&!e.forceOther){const gs=[...new Set(sp.map(x=>x.gender))];if(gs.length===1&&(gs[0]==='Boys'||gs[0]==='Girls'))gender=gs[0];}
  if(e.forceOther)gender=null;
  if(gender==='Mixed')gender=null;
  if(age==null)age=13;
  const combined=sp.length?sp.some(x=>x.combined):true;
  let yk;if(age<=9)yk='LS';else if(age===10)yk='5';else if(age===11)yk='6';else if(age===12)yk=combined?'78':'7';else yk=combined?'78':'8';
  Object.assign(e,{gender,age,ageExplicit,suffix:s,yearKey:yk});
  e.short=((ageExplicit?'U'+age+(s?' ':''):'')+s)||e.raw;
  if(!gender&&!ageExplicit)e.short=e.raw.replace(/^(boys|girls|mixed)\b[\s\-–]*/i,'')||e.raw;
}
const gKey=e=>e.gender==='Boys'||e.gender==='Girls'?e.gender:'Other';
const gk=e=>e.yearKey+'|'+(e.gender||'')+'|'+e.sportKey;
function dispName(e){return [e.gender,e.short].filter(Boolean).join(' ');}
function isTravel(e){const h=(e.ha||'').trim().toUpperCase();if(h==='A'||h==='N')return true;if(h==='H')return false;return !/^home/i.test(e.venue||'');}
function lateMoved(e){return S.settings.lateToHome&&isTravel(e)&&e.meet!=null&&e.meet>=LATE;}
function slotOf(e){return isTravel(e)&&!lateMoved(e)?'away':'home';}
function tKey(e){const v=isTravel(e)?(e.meet!=null?e.meet:e.start):(e.start!=null?e.start:e.meet);return v==null?9999:v;}
function prefDoor(e){const d=S.settings.doors;let v=null;
  switch(e.yearKey){case '5':v=d.y5;break;case '6':v=d.y6;break;case '7':v=d.y7;break;case '8':v=d.y8;break;
    case '78':v=e.gender==='Girls'?d.g78:e.gender==='Boys'?d.b78:null;break;}
  return (v==='art'||v==='chapel')?v:null;}
function tokRank(e){const s=e.suffix||'';if(!s)return[-1,''];if(/^[A-Z]$/i.test(s))return[0,s.toUpperCase()];
  const m=s.match(/^(\d+)(st|nd|rd|th)\b/i);if(m)return[1,+m[1]];return[2,s.toLowerCase()];}
function tokCmp(a,b){const aa=a.ageExplicit?a.age:99,bb=b.ageExplicit?b.age:99;if(aa!==bb)return aa-bb;
  const ra=tokRank(a),rb=tokRank(b);if(ra[0]!==rb[0])return ra[0]-rb[0];return ra[1]<rb[1]?-1:ra[1]>rb[1]?1:0;}
const visible=e=>!e.hidden&&!e.deleted;
function ageLab(e){return (e.ageExplicit||e.gender||/^(\d+)(st|nd|rd|th)$/i.test(e.suffix||''))?(AGEL[e.yearKey]||'U'+e.age):'';}

/* ============ building days ============ */
function buildDays(text){
  const rows=parseCSV(text.replace(/^﻿/,''));
  if(rows.length<2)throw new Error('That file has no fixture rows.');
  const norm=s=>s.toLowerCase().replace(/[^a-z]/g,'');const H=rows[0].map(norm);
  const col=(...n)=>{for(const x of n){const i=H.indexOf(x);if(i>=0)return i;}return -1;};
  const C={date:col('date'),sport:col('sport'),team:col('team'),opp:col('opposition'),ha:col('venue'),venue:col('venuedetails'),
    teacher:col('teacheric','teacher'),transport:col('transport'),meet:col('meettime'),start:col('starttime'),ret:col('returntime'),details:col('moredetails')};
  if(C.date<0||C.team<0)throw new Error("Couldn't find the Date and Team columns. Is this the SOCS fixtures export?");
  const g=(r,k)=>C[k]>=0?(r[C[k]]||'').trim():'';
  const byDate={};
  for(const r of rows.slice(1)){const d=parseDate(g(r,'date'));if(!d)continue;const w=d.getDay();if(w!==3&&w!==6)continue;
    const k=iso(d);(byDate[k]=byDate[k]||{d,recs:[]}).recs.push(r);}
  const today=new Date();today.setHours(0,0,0,0);
  const pick=w=>{const c=Object.values(byDate).filter(x=>x.d.getDay()===w);if(!c.length)return null;
    c.sort((a,b)=>Math.abs(a.d-today)-Math.abs(b.d-today)||b.d-a.d);return c[0];};
  const days={};
  for(const [key,w] of [['wed',3],['sat',6]]){const p=pick(w);if(!p)continue;
    days[key]=makeDay(key,p.d,p.recs.map(r=>({sport:g(r,'sport'),team:g(r,'team'),opp:g(r,'opp'),ha:g(r,'ha'),venue:g(r,'venue'),
      teacher:g(r,'teacher'),transport:g(r,'transport'),meet:g(r,'meet'),start:g(r,'start'),ret:g(r,'ret'),details:g(r,'details')})));
    autoArrange(days[key]);}
  if(!Object.keys(days).length)throw new Error('No Wednesday or Saturday fixtures found in that file.');
  return days;
}
function newEntry(o){return Object.assign({id:uid(),sport:'',raw:'',opp:'',ha:'A',venue:'',teacher:'',transport:'',details:'',meet:null,start:null,ret:null,
  extraOpps:[],hidden:false,hiddenReason:'',early:false,deleted:false,manual:false,edited:false,forceOther:false},o);}
function makeDay(key,d,recs){
  const awayT=toMin(S.settings.times.away);const entries=[],info=[];
  for(const r of recs){const raw=r.team.replace(/\s+/g,' ').trim();if(!raw)continue;
    const prev=entries.find(e=>e.raw===raw&&e.sport===r.sport);
    if(prev&&!r.teacher&&!r.meet){if(r.opp)prev.extraOpps.push(r.opp);continue;}
    const e=newEntry({sport:r.sport,raw,opp:r.opp,ha:r.ha,venue:r.venue,teacher:r.teacher,transport:r.transport,details:r.details,
      meet:toMin24(r.meet),start:toMin24(r.start),ret:toMin24(r.ret)});
    annotate(e);entries.push(e);}
  let ls=0;
  for(const e of entries){
    if(e.yearKey==='LS'){e.hidden=true;e.hiddenReason='Lower School (U9 and below)';ls++;}
    else if(e.meet!=null&&awayT!=null&&e.meet<awayT){e.hidden=true;e.early=true;e.hiddenReason='Meets '+fmt(e.meet)+', before lunch';}
    if(e.extraOpps.length)info.push(dispName(e)+': '+(e.extraOpps.length+1)+' tournament fixtures merged into one entry.');}
  if(ls)info.push(ls+' Lower School team'+(ls>1?'s':'')+' (U9 and below) hidden.');
  const unk=[...new Set(entries.filter(e=>!matchSports(e.sport).length&&e.yearKey!=='LS').map(e=>e.sport).filter(Boolean))];
  if(unk.length)info.push('Not in this term’s sports: '+unk.join(', ')+'. Teams still included.');
  return {key,dateISO:iso(d),title:WD[d.getDay()]+' '+ordinal(d.getDate())+' '+MN[d.getMonth()],
    entries,layout:{},tiles:{},info,balance:[],resolved:{},manual:false};
}

/* ============ arrangement ============ */
function autoArrange(day){
  const lim=S.settings.maxPerDoor;const vis=day.entries.filter(visible);const cellOf={};const balance=[];
  for(const slot of ['away','home']){
    const es=vis.filter(e=>slotOf(e)===slot);const cnt={art:0,chapel:0};const nopref=[];
    for(const u of groupBy(es,gk)){const d=prefDoor(u[0]);if(d){u.forEach(e=>cellOf[e.id]=slot+'-'+d);cnt[d]+=u.length;}else nopref.push(u);}
    nopref.sort((a,b)=>b.length-a.length);
    for(const u of nopref){const d=cnt.art<=cnt.chapel?'art':'chapel';u.forEach(e=>cellOf[e.id]=slot+'-'+d);cnt[d]+=u.length;}
    for(let it=0;it<60;it++){
      const heavy=cnt.art>=cnt.chapel?'art':'chapel',light=heavy==='art'?'chapel':'art';const H=cnt[heavy],L=cnt[light];
      if(H<=lim)break;
      const units=groupBy(es.filter(e=>cellOf[e.id]===slot+'-'+heavy),gk);const cands=[];
      for(const u of units){const s=u.length,nm=Math.max(H-s,L+s);if(nm<H)cands.push({u,nm,whole:1,t:Math.min(...u.map(tKey))});}
      if(!cands.length&&H-L>=2){for(const u of units){const e=[...u].sort((a,b)=>tKey(b)-tKey(a))[0];cands.push({u:[e],nm:Math.max(H-1,L+1),whole:0,t:tKey(e)});}}
      if(!cands.length)break;
      cands.sort((a,b)=>a.nm-b.nm||b.whole-a.whole||b.t-a.t);const best=cands[0];
      best.u.forEach(e=>cellOf[e.id]=slot+'-'+light);cnt[heavy]-=best.u.length;cnt[light]+=best.u.length;
      const names=best.u.map(e=>dispName(e));
      balance.push({ids:best.u.map(e=>e.id),text:'<b>'+esc(names.join(', '))+'</b> moved to '+esc(doorName(light))+' at '+esc(slot==='away'?S.settings.times.away:S.settings.times.home)+' to balance the queues ('+esc(doorName(heavy))+' had '+H+' teams).'});
    }
  }
  day.layout={};day.tiles={};
  for(const c of CELLS){
    const es=vis.filter(e=>cellOf[e.id]===c);
    const groups=groupBy(es,gk).map(list=>{list.sort((a,b)=>tokCmp(a,b)||tKey(a)-tKey(b));return {list,t:Math.min(...list.map(tKey))};});
    groups.sort((a,b)=>a.t-b.t||(YO[a.list[0].yearKey]-YO[b.list[0].yearKey]));
    day.layout[c]=groups.map(g=>{const id='t'+uid();day.tiles[id]=g.list.map(e=>e.id);return id;});
  }
  day.balance=balance;day.manual=false;
}
function entryById(day,id){return day.entries.find(e=>e.id===id);}
function tileOfEntry(day,id){for(const t in day.tiles)if(day.tiles[t].includes(id))return t;return null;}
function cellOfTile(day,tid){for(const c of CELLS)if((day.layout[c]||[]).includes(tid))return c;return null;}
function tileGk(day,tid){const e=entryById(day,day.tiles[tid][0]);return e?gk(e):'';}
function pruneTiles(day){for(const c of CELLS){day.layout[c]=(day.layout[c]||[]).filter(t=>{if(!day.tiles[t]||!day.tiles[t].length){delete day.tiles[t];return false;}return true;});}}
function removeFromTiles(day,ids){const set=new Set(ids);for(const t in day.tiles)day.tiles[t]=day.tiles[t].filter(x=>!set.has(x));pruneTiles(day);}
function cellCount(day,c){return (day.layout[c]||[]).reduce((n,t)=>n+day.tiles[t].length,0);}
function placeEntry(day,e){
  if(e.manual&&(!e.gender||!e.ageExplicit)&&!/^(\d+)(st|nd|rd|th)$/i.test(e.suffix||'')){const id='t'+uid();day.tiles[id]=[e.id];day.layout['away-art'].push(id);return;}
  const slot=slotOf(e);const k=gk(e);
  for(const c of [slot+'-art',slot+'-chapel']){const t=(day.layout[c]||[]).find(t=>tileGk(day,t)===k);if(t){day.tiles[t].push(e.id);sortTile(day,t);return;}}
  let d=prefDoor(e);if(!d)d=cellCount(day,slot+'-art')<=cellCount(day,slot+'-chapel')?'art':'chapel';
  const c=slot+'-'+d;const id='t'+uid();day.tiles[id]=[e.id];
  const tk=tKey(e);const L=day.layout[c];let i=L.findIndex(t=>Math.min(...day.tiles[t].map(x=>tKey(entryById(day,x))))>tk);
  if(i<0)L.push(id);else L.splice(i,0,id);
}
function sortTile(day,t){day.tiles[t].sort((a,b)=>{const A=entryById(day,a),B=entryById(day,b);return tokCmp(A,B)||tKey(A)-tKey(B);});}

/* ============ flags ============ */
function computeFlags(day){
  const st=S.settings;const F=[];
  for(const e of day.entries){
    if(visible(e)&&lateMoved(e))F.push({key:'late:'+e.id,ids:[e.id],html:'<b>'+esc(dispName(e))+'</b> meet at '+fmt(e.meet)+', so they queue with home teams at '+esc(st.times.home)+'.'});
    if(!e.deleted&&e.hidden&&e.early)F.push({key:'early:'+e.id,ids:[],html:'<b>'+esc(dispName(e))+'</b>'+(e.opp?' (v '+esc(e.opp)+')':'')+' meet at '+fmt(e.meet)+', before lunch. Hidden – packed lunch?'});
    if(visible(e)&&!e.gender)F.push({key:'gender:'+e.id,ids:[e.id],html:"Couldn't tell whether <b>"+esc(e.raw)+'</b> is boys or girls. Tap it to set, or add the sport in Settings.'});
  }
  for(const b of day.balance){const ids=b.ids.filter(id=>{const e=entryById(day,id);return e&&visible(e);});if(ids.length)F.push({key:'bal:'+b.ids.join(','),ids,html:b.text});}
  for(const c of CELLS){const n=cellCount(day,c);if(n>st.maxPerDoor){const [slot,door]=c.split('-');F.push({key:'over:'+c,ids:[],html:'<b>'+esc(doorName(door))+'</b> at '+esc(slot==='away'?st.times.away:st.times.home)+' has '+n+' teams, over the limit of '+st.maxPerDoor+'.'});}}
  return F;
}

/* ============ state ops ============ */
function day(){return S.days[S.cur];}
function snap(){return JSON.stringify({days:S.days,settings:S.settings,csvName:S.csvName});}
function restoreSnap(str){const o=JSON.parse(str);S.days=o.days;S.settings=o.settings;S.csvName=o.csvName;if(!S.days[S.cur])S.cur=Object.keys(S.days)[0]||'wed';}
function commit(fn,manual){hist.push(snap());if(hist.length>150)hist.shift();fut=[];fn();if(manual&&day())day().manual=true;persist();render();}
function undo(){if(!hist.length)return;fut.push(snap());restoreSnap(hist.pop());persist();closeFloating();render();toast('Undone');}
function redo(){if(!fut.length)return;hist.push(snap());restoreSnap(fut.pop());persist();closeFloating();render();toast('Redone');}
function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify({days:S.days,settings:S.settings,csvName:S.csvName}));}catch(e){}}
function reannotateAll(){for(const d of Object.values(S.days))for(const e of d.entries)annotate(e);}
function defaultDay(){const w=new Date().getDay();const p=(w>=4&&w<=6)?'sat':'wed';return S.days[p]?p:(S.days.wed?'wed':'sat');}
function changeSettings(fn,arr){const cur=day();
  commit(()=>{fn(S.settings);reannotateAll();if(arr)for(const d of Object.values(S.days))if(!d.manual)autoArrange(d);});
  if(arr&&cur&&cur.manual)toast('This day has been edited by hand. Press Auto-arrange to apply the new settings.',4000);}
function hideIds(ids,reason){const d=day();const es=ids.map(id=>entryById(d,id)).filter(e=>e&&visible(e));if(!es.length)return;
  commit(()=>{es.forEach(e=>{e.hidden=true;e.early=false;e.hiddenReason=reason||'Hidden by hand';});removeFromTiles(d,es.map(e=>e.id));},true);
  toast('Hidden '+(es.length>1?es.length+' teams':dispName(es[0])));}
function unhideIds(ids){const d=day();const es=ids.map(id=>entryById(d,id)).filter(e=>e&&e.hidden&&!e.deleted);if(!es.length)return;
  commit(()=>{es.forEach(e=>{e.hidden=false;e.hiddenReason='';e.early=false;placeEntry(d,e);});},true);}
function deleteEntry(id){const d=day();const e=entryById(d,id);if(!e)return;
  commit(()=>{e.deleted=true;removeFromTiles(d,[id]);},true);toast('Deleted '+dispName(e)+'. Undo or restore it from Deleted teams.');}
function restoreEntry(id){const d=day();const e=entryById(d,id);if(!e)return;
  commit(()=>{e.deleted=false;e.hidden=false;e.hiddenReason='';placeEntry(d,e);},true);}

/* drop operations */
function dropOnTile(drag,tid){const d=day();
  commit(()=>{
    let ids=drag.ids.slice();
    if(drag.kind==='tile'){if(drag.tid===tid)return;}
    ids=ids.filter(id=>!d.tiles[tid].includes(id));
    removeFromTiles(d,ids);
    ids.forEach(id=>{const e=entryById(d,id);e.hidden=false;e.hiddenReason='';e.early=false;});
    if(!d.tiles[tid])return;
    d.tiles[tid].push(...ids);sortTile(d,tid);
  },true);}
function dropOnGap(drag,cell,index){const d=day();
  const L0=(d.layout[cell]||[]).slice();const after=L0.slice(index);
  commit(()=>{
    if(drag.kind==='tile'){
      if(after[0]===drag.tid||(index>0&&L0[index-1]===drag.tid&&cellOfTile(d,drag.tid)===cell))return;
      for(const c of CELLS)d.layout[c]=d.layout[c].filter(t=>t!==drag.tid);
      const L=d.layout[cell];const ref=after.find(t=>t!==drag.tid&&L.includes(t));
      if(ref)L.splice(L.indexOf(ref),0,drag.tid);else L.push(drag.tid);
    }else{
      removeFromTiles(d,drag.ids);
      drag.ids.forEach(id=>{const e=entryById(d,id);e.hidden=false;e.hiddenReason='';e.early=false;});
      const id='t'+uid();d.tiles[id]=drag.ids.slice();sortTile(d,id);
      const L=d.layout[cell];const ref=after.find(t=>L.includes(t));
      if(ref)L.splice(L.indexOf(ref),0,id);else L.push(id);
    }
  },true);}

/* ============ load / save ============ */
function loadCSVText(text,name){let days;try{days=buildDays(text);}catch(err){toast(err.message,4500);return;}
  commit(()=>{S.days=days;S.csvName=name||'';S.cur=defaultDay();});
  const n=Object.values(days).reduce((a,d)=>a+d.entries.length,0);
  toast('Loaded '+n+' fixtures for '+Object.values(days).map(d=>d.title).join(' and '));}
function readFile(file){const r=new FileReader();
  r.onload=()=>{const t=String(r.result);if(/\.json$/i.test(file.name)||/^\s*\{/.test(t))loadJSONText(t);else loadCSVText(t,file.name);};r.readAsText(file);}
function loadJSONText(t){try{const o=JSON.parse(t);const st=o.state||o;if(!st.days)throw 0;
  commit(()=>{S.days=st.days;S.settings=Object.assign(clone(DEF),st.settings||{});S.csvName=st.csvName||'';S.cur=defaultDay();});toast('Save file opened');}
  catch(e){toast("That doesn't look like a Matchday Queues save file.",4000);}}
let dlNS=null;
function initDownloads(n){try{if(window.claude&&typeof window.claude.use==='function'){window.claude.use('downloads').then(ns=>{dlNS=ns;}).catch(()=>{});return;}}catch(e){}
  if((n||0)<10)setTimeout(()=>initDownloads((n||0)+1),500);}
async function saveFile(filename,data){
  if(dlNS){try{await dlNS.save({filename,data});toast('Saved '+filename);return;}catch(err){if(err&&err.code==='declined')return;}}
  try{const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}catch(e){toast("Downloads aren't available here.",3500);}}

function tileInfo(day,tid,cell){
  const es=day.tiles[tid].map(id=>entryById(day,id));const e0=es[0];const ageL=ageLab(e0);
  const k=gk(e0);const same=day.entries.filter(x=>!x.deleted&&gk(x)===k);
  const all=S.settings.useAll&&new Set(es.map(x=>x.raw)).size>=2&&same.every(x=>visible(x)&&day.tiles[tid].includes(x.id));
  const seen=new Set(),uniq=[];for(const x of es)if(!seen.has(x.raw)){seen.add(x.raw);uniq.push(x);}
  const chips=all?['All']:uniq.map(x=>{if(!ageL)return x.raw;if(!x.ageExplicit)return x.suffix||x.short;if('U'+x.age===ageL)return x.suffix||x.short;return x.short;});
  const head=[S.settings.showYear?YL[e0.yearKey]:'',e0.gender||'',ageL].filter(Boolean).join(' ');
  if(!head)return {es,e0,ageL,all,chips:[],head:chips.join(', '),t:Math.min(...es.map(tKey))};
  return {es,e0,ageL,all,chips,head,t:Math.min(...es.map(tKey))};
}
function sheetModel(d){const st=S.settings;

  const rows=[{type:'slot',time:st.times.away,label:'Away',cells:[cellLines('away-art'),cellLines('away-chapel')]}];
  if(d.key==='wed'&&st.lowerSchool)rows.push({type:'lower',time:st.times.lower});

function rr(x,X,Y,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(X,Y,w,h,r);else{x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}}
function drawSheet(m){
  const W=1000,PX=44,PT=40,RAIL=112,G=10,CW=(W-2*PX-RAIL-2*G)/2,LINE='#E2DED5';
  const SG='"Space Grotesk", Inter, sans-serif',IN='Inter, "Segoe UI", sans-serif';
  const sp=(x,v)=>{try{x.letterSpacing=v;}catch(e){}};
  const layoutCell=(x,lines)=>{const out=[];let h=16;
    lines.forEach((ln,li)=>{if(li)h+=12;x.font='700 17px '+IN;sp(x,'0px');const hw=Math.max(96,x.measureText(ln.head).width)+4+6;
      let cx=hw,cy=0;const pills=[];x.font='600 15px '+IN;
      const items=ln.chips.map(c=>({t:c,w:x.measureText(c).width+18}));if(ln.time)items.push({t:ln.time,w:0,time:true});
      for(const it of items){let w=it.time?(x.font='500 14px '+IN,x.measureText(it.t).width+4):it.w;x.font='600 15px '+IN;
        if(cx+w>CW-32&&cx>hw-0.1&&cx!==hw){cx=0;cy+=34;}else if(cx+w>CW-32&&cx===hw&&pills.length){cx=0;cy+=34;}
        pills.push({x:cx,y:cy,w,t:it.t,time:it.time});cx+=w+6;}
      out.push({head:ln.head,y:h,pills});h+=Math.max(28,cy+28);});
    if(!lines.length)h+=24;return {items:out,h:h+16};};
  const pass=(x,draw)=>{
    let y=PT;const tx=PX+RAIL+G;
    if(draw){x.textBaseline='top';x.fillStyle='#5E6573';x.font='700 13px '+IN;sp(x,'2px');x.fillText('MATCHDAY QUEUES',tx,y);sp(x,'0px');}
    y+=19;if(draw){x.fillStyle='#141B2D';x.font='700 40px '+SG;sp(x,'-0.8px');x.fillText(m.date,tx,y);sp(x,'0px');}
    y+=40+26;
    const xs=[PX+RAIL+G,PX+RAIL+G+CW+G];
    if(draw){[['art',0],['chapel',1]].forEach(([k,i])=>{x.fillStyle=DOOR[k].main;rr(x,xs[i],y,CW,46,12);x.fill();x.fillStyle='#fff';x.font='700 18px '+SG;x.fillText(S.settings.doorNames[k],xs[i]+18,y+13);});}
    y+=46+10;
    for(const r of m.rows){
      if(draw){x.fillStyle=LINE;x.fillRect(PX,y,W-2*PX,1.5);}y+=1.5+12;
      if(r.type==='lower'){const h=44;
        if(draw){x.fillStyle='#6B7180';x.font='700 24px '+SG;x.fillText(r.time,PX+4,y+(h-24)/2);
          x.fillStyle='#E4EAEA';rr(x,xs[0],y,CW*2+G,h,12);x.fill();x.fillStyle='#3E5355';x.font='700 14px '+IN;sp(x,'8px');x.textAlign='center';x.fillText('LOWER SCHOOL',xs[0]+(CW*2+G)/2+4,y+15);x.textAlign='left';sp(x,'0px');}
        y+=h;}
      else{const L=[layoutCell(x,r.cells[0]),layoutCell(x,r.cells[1])];const h=Math.max(L[0].h,L[1].h,80);
        if(draw){const bh=32+4+14;const by=y+(h-bh)/2;x.fillStyle='#141B2D';x.font='700 32px '+SG;sp(x,'-0.5px');x.fillText(r.time,PX+4,by);sp(x,'1.6px');
          x.fillStyle='#5E6573';x.font='600 12px '+IN;x.fillText(r.label.toUpperCase(),PX+4,by+36);sp(x,'0px');
          ['art','chapel'].forEach((k,i)=>{x.fillStyle=DOOR[k].tint;rr(x,xs[i],y,CW,h,12);x.fill();
            for(const it of L[i].items){const ly=y+it.y;x.fillStyle='#141B2D';x.font='700 17px '+IN;x.fillText(it.head,xs[i]+16,ly+5);
              for(const p of it.pills){const px=xs[i]+16+p.x,py=ly+p.y;
                if(p.time){x.fillStyle='#5E6573';x.font='500 14px '+IN;x.fillText(p.t,px+2,py+6);continue;}
                x.fillStyle='#fff';rr(x,px,py,p.w,28,7);x.fill();x.fillStyle=DOOR[k].ink;x.font='600 15px '+IN;x.fillText(p.t,px+9,py+6);}}});}
        y+=h;}
      y+=12;}
    if(draw){x.fillStyle=LINE;x.fillRect(PX,y,W-2*PX,1.5);}y+=1.5;
    return y+PT;};
  const mc=document.createElement('canvas').getContext('2d');const H=pass(mc,false);
  const sc=2,c=document.createElement('canvas');c.width=W*sc;c.height=Math.ceil(H*sc);const x=c.getContext('2d');x.scale(sc,sc);
  x.fillStyle='#fff';x.fillRect(0,0,W,H);pass(x,true);return c;}

  if(!name){toast('Give the team a name, e.g. U10 E');return;}
  const t=toMin24(tm);if(tm&&t==null){toast('Use a time like 13:15');return;}
  const raw=E.gender==='Other'?name:E.gender+'-'+name;
  commit(()=>{
    if(!E.id){const sp=S.settings.sports.find(x=>x.gender===E.gender);const e=newEntry({raw,ha:E.ha,manual:true,forceOther:E.gender==='Other',sport:sp?sp.name:''});if(E.ha==='A')e.meet=t;else e.start=t;annotate(e);d.entries.push(e);placeEntry(d,e);}
    else{const e=entryById(d,E.id);const oldK=gk(e),oldS=slotOf(e);
      e.raw=raw;e.forceOther=E.gender==='Other';e.ha=E.ha;if(E.ha==='A')e.meet=t;else e.start=t;e.edited=true;annotate(e);
      if(visible(e)&&(gk(e)!==oldK||slotOf(e)!==oldS)){removeFromTiles(d,[e.id]);placeEntry(d,e);}
      else{const tt=tileOfEntry(d,e.id);if(tt)sortTile(d,tt);}}
  },true);
  ui.edit=null;renderEdit();}
$('#pop').addEventListener('submit',ev=>{ev.preventDefault();saveEdit();});
$('#pop').addEventListener('click',ev=>{const E=ui.edit;if(!E)return;const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.eg||b.dataset.eh){E.name=$('#eName').value;E.time=$('#eTime').value;if(b.dataset.eg)E.gender=b.dataset.eg;if(b.dataset.eh)E.ha=b.dataset.eh;ev.stopPropagation();renderEdit();}});

/* ============ menus ============ */
function closeFloating(){ui.menu=null;$('#menuFile').hidden=true;$('#menuExport').hidden=true;$('#fileBtn').classList.remove('open');ui.edit=null;$('#pop').hidden=true;}
function openMenu(which){const btn=which==='file'?$('#fileBtn'):$('#exportBtn');const m=which==='file'?$('#menuFile'):$('#menuExport');
  if(ui.menu===which){closeFloating();return;}closeFloating();ui.menu=which;m.hidden=false;if(which==='file')btn.classList.add('open');
  const r=btn.getBoundingClientRect();m.style.top=(r.bottom+10)+'px';m.style.left=Math.max(12,Math.min(innerWidth-m.offsetWidth-12,r.right-m.offsetWidth))+'px';
  if(which==='export')buildPreview();}
async function buildPreview(){const pv=$('#prev');if(!day()){pv.textContent='';return;}await fontsReady();const c=drawSheet(sheetModel(day()));pv.innerHTML='<img alt="Preview of the exported sheet" src="'+c.toDataURL('image/png')+'">';}

/* ============ settings ============ */
function openSettings(){closeFloating();renderSettings();$('#settingsModal').classList.add('open');}
function closeSettings(){$('#settingsModal').classList.remove('open');}
function renderSettings(){const st=S.settings;
  const sw=on=>'<button type="button" class="sw'+(on?' on':'')+'" aria-pressed="'+on+'"><i></i></button>';
  const dseg=(k,lab)=>'<div class="drow"><span>'+lab+'</span><div class="dseg" role="group" aria-label="'+lab+' door">'+
    '<button type="button" class="art'+(st.doors[k]==='art'?' on':'')+'" data-door="'+k+'" data-v="art">Art</button>'+
    '<button type="button" class="chapel'+(st.doors[k]==='chapel'?' on':'')+'" data-door="'+k+'" data-v="chapel">Chapel</button>'+
    '<button type="button" class="e'+(!st.doors[k]?' on':'')+'" data-door="'+k+'" data-v="">Either</button></div></div>';
  const sprow=(s,i,fixed)=>'<div class="sprow r-'+(s.gender==='Boys'||s.gender==='Girls'?s.gender:'Other')+'">'+
    (fixed?'<span class="gl">'+s.gender+'</span>':'<select data-xg="'+i+'" aria-label="Who plays it">'+['Boys','Girls','Mixed','Other'].map(g=>'<option'+(s.gender===g?' selected':'')+'>'+g+'</option>').join('')+'</select>')+
    '<input type="text" '+(fixed?'data-fs="'+i+'"':'data-xn="'+i+'"')+' value="'+esc(s.name)+'" aria-label="Sport name" placeholder="Sport">'+
    '<button type="button" class="tog78'+(s.combined?' on':'')+'" '+(fixed?'data-fc="'+i+'"':'data-xc="'+i+'"')+' aria-pressed="'+!!s.combined+'">'+(s.combined?IC.check:'')+'Y7 &amp; Y8 together</button>'+
    (fixed?'<span></span>':'<button type="button" class="rm" data-xr="'+i+'" aria-label="Remove sport">'+IC.x+'</button>')+'</div>';
  const tg=(k,lab,sub)=>'<div class="trow" data-tg="'+k+'"><div class="tx"><b>'+lab+'</b><span>'+sub+'</span></div>'+sw(!!st[k])+'</div>';
  $('#settingsSheet').innerHTML='<div style="display:flex;align-items:center;gap:12px"><h1>Settings</h1><button type="button" class="close" data-act="closesettings" aria-label="Close settings">'+IC.x+'</button></div>'+
  '<section class="sec"><h2>Sports</h2><div class="termrow"><label class="term">Term<select id="termSel">'+TERMS.map(t=>'<option'+(st.term===t?' selected':'')+'>'+t+'</option>').join('')+'<option'+(st.term==='Custom'?' selected':'')+'>Custom</option></select></label>'+
    '<div class="sports">'+st.sports.map((s,i)=>sprow(s,i,true)).join('')+st.extraSports.map((s,i)=>sprow(s,i,false)).join('')+
    '<button type="button" class="addsp" data-act="addsport"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add sport</button></div></div></section>'+
  '<div class="cols"><section class="sec"><h2>Preferred doors</h2>'+dseg('y5','Year 5')+dseg('y6','Year 6')+dseg('y7','Year 7')+dseg('y8','Year 8')+dseg('g78','Y7 &amp; Y8 Girls')+dseg('b78','Y7 &amp; Y8 Boys')+'</section>'+
    '<section class="sec"><h2>Queue</h2><div class="qbox"><div class="top"><label for="maxPer" style="font-weight:600">Max teams per door</label><b id="maxVal">'+st.maxPerDoor+'</b></div><input id="maxPer" type="range" min="3" max="20" value="'+st.maxPerDoor+'"></div>'+
    '<div class="three"><label class="fl">Away<input data-tm="away" value="'+esc(st.times.away)+'"></label><label class="fl">Lower School<input data-tm="lower" value="'+esc(st.times.lower)+'"></label><label class="fl">Home<input data-tm="home" value="'+esc(st.times.home)+'"></label></div>'+
    '<div class="two"><label class="fl">Door 1<span class="dn"><i style="background:#2E6E6E"></i><input data-dn="art" value="'+esc(st.doorNames.art)+'"></span></label><label class="fl">Door 2<span class="dn"><i style="background:#333A47"></i><input data-dn="chapel" value="'+esc(st.doorNames.chapel)+'"></span></label></div></section></div>'+
  '<section class="sec"><h2>Sheet</h2><div class="togs">'+
    tg('showYear','Show year groups','Adds the year to each line, e.g. Year 5 Boys U10 A C')+
    tg('useAll','Say “All” for whole groups','Writes All when every team in a year group eats together')+
    tg('showTimes','Show leave times','Adds each group’s earliest leave time to the sheet')+
    tg('lateToHome','Late leavers eat with home','Away teams meeting at 14:00 or later queue at '+esc(st.times.home))+
    tg('lowerSchool',esc(st.times.lower)+' Lower School on Wednesdays','Adds the Lower School row to Wednesday’s sheet')+'</div></section>'+
  '<div class="foot"><button type="button" class="b2" data-act="resetsettings">Reset to defaults</button><button type="button" class="b1" data-act="closesettings">Done</button></div>';
  const mp=$('#maxPer');mp.addEventListener('input',()=>{$('#maxVal').textContent=mp.value;});
}
const ARR_KEYS=['lateToHome'];
$('#settingsSheet').addEventListener('click',ev=>{const t=ev.target.closest('button,.trow');if(!t)return;
  if(t.dataset.door!=null){const k=t.dataset.door,v=t.dataset.v;changeSettings(s=>{s.doors[k]=v;},true);renderSettings();return;}
  if(t.dataset.fc!=null){const i=+t.dataset.fc;changeSettings(s=>{s.sports[i].combined=!s.sports[i].combined;s.term='Custom';},true);renderSettings();return;}
  if(t.dataset.xc!=null){const i=+t.dataset.xc;changeSettings(s=>{s.extraSports[i].combined=!s.extraSports[i].combined;s.term='Custom';},true);renderSettings();return;}
  if(t.dataset.xr!=null){const i=+t.dataset.xr;changeSettings(s=>{s.extraSports.splice(i,1);s.term='Custom';},true);renderSettings();return;}
  const row=ev.target.closest('.trow');if(row){const k=row.dataset.tg;changeSettings(s=>{s[k]=!s[k];},ARR_KEYS.includes(k));renderSettings();}});
$('#settingsSheet').addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='termSel'){const v=t.value;if(v==='Custom'){changeSettings(s=>{s.term='Custom';},false);return;}changeSettings(s=>{s.term=v;s.sports=clone(PRESETS[v]);},true);renderSettings();return;}
  if(t.id==='maxPer'){const v=+t.value;changeSettings(s=>{s.maxPerDoor=v;},true);return;}
  if(t.dataset.fs!=null){const i=+t.dataset.fs,v=t.value.trim();changeSettings(s=>{s.sports[i].name=v;s.term='Custom';},true);renderSettings();return;}
  if(t.dataset.xn!=null){const i=+t.dataset.xn,v=t.value.trim();changeSettings(s=>{s.extraSports[i].name=v;s.term='Custom';},true);renderSettings();return;}
  if(t.dataset.xg!=null){const i=+t.dataset.xg,v=t.value;changeSettings(s=>{s.extraSports[i].gender=v;s.term='Custom';},true);renderSettings();return;}
  if(t.dataset.tm){const k=t.dataset.tm,v=t.value.trim();if(toMin(v)==null){toast('Use a time like 13:20');t.value=S.settings.times[k];return;}changeSettings(s=>{s.times[k]=v;},false);renderSettings();return;}
  if(t.dataset.dn){const k=t.dataset.dn,v=t.value.trim()||DEF.doorNames[k];changeSettings(s=>{s.doorNames[k]=v;},false);renderSettings();}});
$('#settingsModal').addEventListener('pointerdown',e=>{if(e.target.id==='settingsModal')closeSettings();});

/* ============ clicks ============ */
document.addEventListener('click',ev=>{
  const fl=ev.target.closest('input[data-flag]');if(fl){const k=fl.dataset.flag;const v=fl.checked;commit(()=>{if(v)day().resolved[k]=true;else delete day().resolved[k];});return;}
  if(ui.edit&&!ev.target.closest('#pop,.chip,[data-act="add"]')){ui.edit=null;renderEdit();}
  const b=ev.target.closest('[data-act]');
  if(!b){if(ui.menu&&!ev.target.closest('.menu'))closeFloating();return;}
  if(b.disabled)return;const a=b.dataset.act;
  if(a!=='filemenu'&&a!=='exportmenu'&&ui.menu&&!b.closest('.menu'))closeFloating();
  switch(a){
    case 'upload':$('#csvInput').click();break;
    case 'example':loadCSVText($('#exampleCsv').textContent.trim(),'example week');break;
    case 'filemenu':openMenu('file');break;
    case 'exportmenu':openMenu('export');break;
    case 'new':closeFloating();if(!Object.keys(S.days).length)break;commit(()=>{S.days={};S.csvName='';});toast('Cleared. Undo brings it back.');break;
    case 'open':closeFloating();$('#jsonInput').click();break;
    case 'save':closeFloating();saveJSON();break;
    case 'copyimg':copyImage();break;
    case 'copyhtml':copyTable();break;
    case 'png':downloadPNG();break;
    case 'day':S.cur=b.dataset.day;ui.hideMode=false;closeFloating();render();break;
    case 'auto':commit(()=>autoArrange(day()));toast('Auto-arranged '+day().title);break;
    case 'add':ui.hideMode=false;render();openEdit(null,document.querySelector('[data-act="add"]'));break;
    case 'hidemode':ui.hideMode=!ui.hideMode;closeFloating();render();break;
    case 'undo':undo();break;case 'redo':redo();break;
    case 'settings':openSettings();break;
    case 'closesettings':closeSettings();break;
    case 'resetsettings':changeSettings(s=>{Object.assign(s,clone(DEF));},true);renderSettings();break;
    case 'addsport':changeSettings(s=>{s.extraSports.push({gender:'Boys',name:'',combined:true});s.term='Custom';},false);renderSettings();break;
    case 'unhide':unhideIds([b.dataset.id]);break;
    case 'unhideall':unhideIds(day().entries.filter(e=>e.hidden&&!e.deleted).map(e=>e.id));toast('All teams unhidden');break;
    case 'restore':restoreEntry(b.dataset.id);break;
    case 'toggleResolved':ui.showResolved=!ui.showResolved;render();break;
    case 'toggleDeleted':ui.showDeleted=!ui.showDeleted;render();break;
    case 'ecancel':ui.edit=null;renderEdit();break;
    case 'edelete':{const id=ui.edit.id;ui.edit=null;renderEdit();deleteEntry(id);break;}
  }});
async function copyImage(){if(!day())return;const p=(async()=>{await fontsReady();const c=drawSheet(sheetModel(day()));return await new Promise(r=>c.toBlob(r,'image/png'));})();
  try{if(!window.ClipboardItem)throw 0;await navigator.clipboard.write([new ClipboardItem({'image/png':p})]);toast('Copied as an image. Paste it into your email or Teams.');closeFloating();}
  catch(e){toast("Copying images isn't allowed here. Use Download PNG instead.",4000);}}
async function copyTable(){const m=sheetModel(day());const html=sheetHTML(m),txt=sheetText(m);
  try{if(!window.ClipboardItem)throw 0;await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'})})]);toast('Copied as a table. Paste it into Outlook or Teams.');closeFloating();return;}catch(e){}
  try{const box=document.createElement('div');box.contentEditable='true';box.style.cssText='position:fixed;left:-9999px;top:0';box.innerHTML=html;document.body.appendChild(box);
    const r=document.createRange();r.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(r);const ok=document.execCommand('copy');s.removeAllRanges();box.remove();
    toast(ok?'Copied as a table. Paste it into Outlook or Teams.':"Couldn't copy here.");}catch(e){toast("Couldn't copy here.");}}
async function downloadPNG(){await fontsReady();const c=drawSheet(sheetModel(day()));c.toBlob(bl=>saveFile('matchday-queues-'+day().dateISO+'.png',bl),'image/png');}

$('#csvInput').addEventListener('change',e=>{const f=e.target.files[0];if(f)readFile(f);e.target.value='';});
$('#jsonInput').addEventListener('change',e=>{const f=e.target.files[0];if(f)readFile(f);e.target.value='';});
window.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();const dz=$('#dz');if(dz)dz.classList.add('over');}});
window.addEventListener('dragleave',()=>{const dz=$('#dz');if(dz)dz.classList.remove('over');});
window.addEventListener('drop',e=>{if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();readFile(e.dataTransfer.files[0]);});
window.addEventListener('resize',()=>{if(ui.edit)positionPop();if(ui.menu)closeFloating();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(ui.hideMode){ui.hideMode=false;render();}closeFloating();closeSettings();return;}
  if(e.target.closest&&e.target.closest('input,select,textarea'))return;
  const mod=e.ctrlKey||e.metaKey;if(!mod)return;const k=e.key.toLowerCase();
  if(k==='z'&&!e.shiftKey){e.preventDefault();undo();}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo();}});

/* ============ drag & drop (mouse + touch) ============ */
let drag=null;
document.addEventListener('pointerdown',e=>{
  if(e.button>0||e.target.closest('button,input,select,label.fitem'))return;
  const chip=e.target.closest('.chip'),handle=e.target.closest('.tlab'),hrow=e.target.closest('.hrow[data-hid]');
  if(!chip&&!handle&&!hrow)return;
  const d=day();let o;
  if(chip){const id=chip.dataset.id;o={kind:'chip',ids:[id],src:chip,tid:tileOfEntry(d,id)};}
  else if(handle){const t=handle.dataset.tileHandle;o={kind:'tile',ids:d.tiles[t].slice(),src:handle.closest('.tile'),tid:t};}
  else{o={kind:'hidden',ids:[hrow.dataset.hid],src:hrow,tid:null};}
  if(ui.hideMode){if(o.kind==='hidden')return;e.preventDefault();ui.hideMode=false;hideIds(o.ids);return;}
  const e0=entryById(d,o.ids[0]);o.gk=gk(e0);o.label=tileLabelFor(e0);
  o.x0=e.clientX;o.y0=e.clientY;o.active=false;o.over=null;drag=o;
});
function targetAt(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;
  const gap=el.closest('.gap');if(gap)return {type:'gap',el:gap,cell:gap.dataset.cell,idx:+gap.dataset.idx};
  const tile=el.closest('.tile');if(tile){if(tile.classList.contains('canjoin'))return {type:'tile',el:tile,tid:tile.dataset.tile};return {type:'none'};}
  const hb=el.closest('[data-drop="hidden"]');if(hb&&drag.kind!=='hidden')return {type:'hidden',el:hb};
  const cb=el.closest('[data-cellbox]');if(cb){const g=cb.querySelector('.gap.last');return {type:'gap',el:g,cell:g.dataset.cell,idx:+g.dataset.idx};}
  return null;}
function setOver(t){const prev=drag.over;if(prev&&t&&prev.el===t.el)return;
  if(prev&&prev.el){prev.el.classList.remove('on','over');}
  drag.over=t&&t.type!=='none'?t:null;
  if(drag.over){if(t.type==='gap'){t.el.classList.add('on');t.el.querySelector('.gapin').innerHTML=IC.plus+'New '+esc(drag.label)+' tile here';}else t.el.classList.add('over');}}
document.addEventListener('pointermove',e=>{if(!drag)return;
  if(!drag.active){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;
    drag.active=true;closeFloating();const r=drag.src.getBoundingClientRect();drag.dx=drag.x0-r.left;drag.dy=drag.y0-r.top;
    const g=drag.src.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.height=r.height+'px';document.body.appendChild(g);drag.ghost=g;
    drag.src.classList.add('dragsrc');document.body.classList.add('dragging');
    document.querySelectorAll('.tile').forEach(t=>{const ok=t.dataset.gk===drag.gk&&!(drag.kind==='tile'&&t.dataset.tile===drag.tid);t.classList.toggle('canjoin',ok);t.classList.toggle('nojoin',!ok);});}
  e.preventDefault();
  drag.ghost.style.left=(e.clientX-drag.dx)+'px';drag.ghost.style.top=(e.clientY-drag.dy)+'px';
  setOver(targetAt(e.clientX,e.clientY));
},{passive:false});
function endDrag(e,cancel){if(!drag)return;const d0=drag;drag=null;
  if(!d0.active){if(!cancel&&d0.kind==='chip')openEdit(d0.ids[0],d0.src);return;}
  d0.ghost.remove();d0.src.classList.remove('dragsrc');document.body.classList.remove('dragging');
  document.querySelectorAll('.canjoin,.nojoin,.gap.on,.over').forEach(x=>x.classList.remove('canjoin','nojoin','on','over'));
  const t=d0.over;if(cancel||!t)return;
  if(t.type==='tile')dropOnTile(d0,t.tid);
  else if(t.type==='gap')dropOnGap(d0,t.cell,t.idx);
  else if(t.type==='hidden')hideIds(d0.ids);}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

/* ============ boot ============ */
try{const raw=localStorage.getItem(LS_KEY);if(raw){const o=JSON.parse(raw);if(o&&o.days){S.days=o.days;S.settings=Object.assign(clone(DEF),o.settings||{});S.csvName=o.csvName||'';}}}catch(e){}
S.cur=defaultDay();
initDownloads(0);
render();
window.__MQ={S,day,sheetModel,computeFlags,drawSheet,tileInfo};
})();
</script>
