<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Tree</title>
<style>
:root{--paper:#f4ecd8;--paper2:#e9dcbd;--ink:#3a2e22;--soft:#6e5d49;--line:#7a6650;--accent:#8a3b2a;--rule:#cdbb97;--serif:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--serif);color:var(--ink);background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:linear-gradient(#efe4c9,#e8dabb);border-bottom:1px solid var(--rule);flex-wrap:wrap;position:relative;z-index:5}
.bar .sp{flex:1}
#title{font:italic 600 22px var(--serif);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 8px;min-width:120px;width:min(320px,40vw)}
#title:hover,#title:focus{border-color:#c3b08a;background:#fbf5e6;outline:none}
.btn{font:inherit;font-size:13px;padding:6px 11px;border:1px solid #b9a67e;background:#f7f0de;color:var(--ink);border-radius:6px;cursor:pointer;list-style:none;white-space:nowrap}
.btn:hover{background:#fffaf0}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:#fbf4e4;border-color:#6d2c1e}
.btn.primary:hover{background:#9c4634}
.btn.danger{color:#8a2a22;border-color:#c79a92}
summary.btn::-webkit-details-marker{display:none}
.search{position:relative}
#q{font:inherit;font-size:13px;padding:6px 10px;border:1px solid #b9a67e;border-radius:6px;background:#fffaf0;width:190px}
#qres{position:absolute;top:100%;left:0;right:0;background:#fffaf0;border:1px solid #b9a67e;border-radius:6px;margin-top:3px;box-shadow:0 6px 18px rgba(60,40,20,.2);z-index:20;max-height:260px;overflow:auto}
#qres button{display:block;width:100%;text-align:left;font:inherit;font-size:13px;padding:7px 10px;background:none;border:0;border-bottom:1px solid #eadfc4;cursor:pointer;color:var(--ink)}
#qres button:hover,#qres button.hi{background:#f1e6cc}
#qres small{color:var(--soft)}
.menu{position:relative}
.mpop{position:absolute;right:0;top:110%;background:#fffaf0;border:1px solid #b9a67e;border-radius:8px;padding:6px;box-shadow:0 8px 22px rgba(60,40,20,.25);display:flex;flex-direction:column;gap:2px;min-width:200px;z-index:30}
.mpop button{font:inherit;font-size:13px;text-align:left;background:none;border:0;padding:8px 10px;border-radius:5px;cursor:pointer;color:var(--ink)}
.mpop button:hover{background:#f1e6cc}
.mpop hr{border:0;border-top:1px solid var(--rule);margin:4px 0;width:100%}
#banner{background:#f3dfb0;border-bottom:1px solid #d3b66e;padding:7px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#banner[hidden]{display:none}
main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;position:relative;min-width:0;background:radial-gradient(ellipse at 50% 40%,#f8f1df 0%,#eadfc2 100%);overflow:hidden}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:1}
#svg.dragging{cursor:grabbing}
#svg .card{cursor:pointer}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:2;pointer-events:none;text-align:center;padding:20px}
#empty[hidden]{display:none}
#empty h2{margin:0;font-style:italic;font-weight:600;font-size:26px}
#empty p{margin:0;color:var(--soft)}
#empty .btn{pointer-events:auto}
.legend{position:absolute;left:12px;bottom:12px;z-index:3;background:rgba(251,245,230,.92);border:1px solid var(--rule);border-radius:8px;padding:7px 10px;font-size:11.5px;color:var(--soft);display:flex;flex-direction:column;gap:3px}
.legend div{display:flex;align-items:center;gap:8px}
.zoomhint{position:absolute;right:12px;bottom:12px;z-index:3;font-size:11.5px;color:var(--soft);background:rgba(251,245,230,.85);border-radius:6px;padding:4px 8px}
#panel{width:0;overflow:hidden;background:#f9f3e3;border-left:1px solid var(--rule);flex:none;z-index:4}
#panel.open{width:340px}
.pin{width:340px;height:100%;overflow-y:auto;padding:14px 16px 28px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ph h2{margin:0;font-size:21px;line-height:1.2;font-weight:600}
.x{font-size:22px;line-height:1;border:0;background:none;cursor:pointer;color:var(--soft);padding:0 4px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 4px}
.pin h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);margin:20px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--rule);font-weight:600}
label{display:block;font-size:12px;color:var(--soft);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;font-size:14px;padding:6px 8px;border:1px solid #c3b08a;background:#fffaf0;border-radius:6px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(138,59,42,.35);border-color:var(--accent)}
textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:12px}
label.chk input{width:auto}
.item{background:#fffaf0;border:1px solid #dccfae;border-radius:8px;padding:8px 10px;margin-bottom:8px}
.item .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.link{background:none;border:0;font:inherit;color:var(--accent);cursor:pointer;padding:0;text-align:left;text-decoration:underline;text-underline-offset:2px}
.mini{font-size:12px;color:var(--soft)}
.item select,.item input{font-size:13px;padding:4px 6px}
.item .row2{margin-top:6px}
.muted{color:var(--soft);font-size:13px}
dialog{border:1px solid #b9a67e;border-radius:12px;background:#fbf5e6;color:var(--ink);padding:0;width:min(420px,92vw);box-shadow:0 20px 60px rgba(40,25,10,.4);font-family:var(--serif)}
dialog::backdrop{background:rgba(50,35,20,.4)}
.dbox{padding:18px 20px 16px}
.dbox h3{margin:0 0 6px;font-size:19px;font-weight:600}
.seg{display:flex;gap:16px;margin:10px 0 2px}
.seg label{display:flex;gap:6px;align-items:center;margin:0;font-size:13px;color:var(--ink)}
.seg input{width:auto}
.dact{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#dErr{color:#8a2a22;font-size:13px;min-height:16px;margin-top:8px}
#printArea{display:none}
@media (max-width:760px){
  #panel{position:absolute;left:0;right:0;bottom:0;width:auto;height:0;transition:height .2s;border-left:0;border-top:1px solid var(--rule);box-shadow:0 -6px 20px rgba(60,40,20,.2)}
  #panel.open{width:auto;height:56%}
  .pin{width:auto}
  #q{width:130px}
  .legend,.zoomhint{display:none}
}
@media print{
  body{display:block;overflow:visible;height:auto;background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;position:fixed;left:0;top:0;width:100%;height:100%}
  #printArea svg{width:100%;height:100%;display:block}
}
</style>
</head>
<body>
<header class="bar">
  <input id="title" value="" aria-label="Tree title" spellcheck="false">
  <div class="sp"></div>
  <div class="search"><input id="q" placeholder="Find a person…" autocomplete="off" aria-label="Find a person"><div id="qres" hidden></div></div>
  <button class="btn" id="bUndo" disabled>↶ Undo</button>
  <button class="btn primary" id="bAdd">+ Person</button>
  <button class="btn" id="bFit">Fit all</button>
  <button class="btn" id="bZo" aria-label="Zoom out">−</button>
  <button class="btn" id="bZi" aria-label="Zoom in">+</button>
  <details class="menu" id="menu"><summary class="btn">File ▾</summary>
    <div class="mpop">
      <button data-m="backup">Back up (copy text)</button>
      <button data-m="restore">Restore from backup…</button>
      <hr>
      <button data-m="png">Export as image (PNG)</button>
      <button data-m="print">Print / save as poster PDF</button>
      <hr>
      <button data-m="reset">Reset manual positions</button>
      <button data-m="sample">Load sample family</button>
      <button data-m="clear">Clear everything</button>
    </div>
  </details>
</header>
<div id="banner" hidden><span id="bannerTxt"></span><button class="btn" id="bBackup">Back up now</button><button class="btn" id="bLater">Later</button></div>
<main>
  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="vp"><g id="tree"></g></g></svg>
    <div id="empty" hidden><h2>Your tree is empty</h2><p>Start with yourself, or the oldest person you know of.</p><button class="btn primary" id="bFirst">+ Add the first person</button></div>
    <div class="legend">
      <div><svg width="34" height="8"><path d="M1 4H33" stroke="#7a6650" stroke-width="2" stroke-linecap="round"/></svg>Partners · birth child</div>
      <div><svg width="34" height="8"><path d="M1 4H33" stroke="#7a6650" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round"/></svg>Ex-partner</div>
      <div><svg width="34" height="8"><path d="M1 4H33" stroke="#7a6650" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/></svg>Adopted child</div>
      <div><svg width="34" height="8"><path d="M1 4H33" stroke="#7a6650" stroke-width="2" stroke-dasharray="9 4 2 4" stroke-linecap="round"/></svg>Step child</div>
    </div>
    <div class="zoomhint">Scroll to zoom · drag to pan · click a person</div>
  </div>
  <aside id="panel"></aside>
</main>
<dialog id="dlg"></dialog>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
/* <core> */
const CW=176,CH=68,PG=58,UG=34,GG=44,RH=176,COMP_GAP=140;
const yearOf=s=>{const m=/(\d{4})/.exec(s||'');return m?+m[1]:null;};

function computeLayout(people,fams0){
  const byId=new Map(people.map(p=>[p.id,p]));
  const fams=fams0.filter(f=>byId.has(f.a)&&byId.has(f.b)&&f.a!==f.b);
  const famById=new Map(fams.map(f=>[f.id,f]));
  const famIdx=new Map(fams.map((f,i)=>[f.id,i]));
  const famsOf=new Map(people.map(p=>[p.id,[]]));
  const kidsOf=new Map(fams.map(f=>[f.id,[]]));
  fams.forEach(f=>{famsOf.get(f.a).push(f);famsOf.get(f.b).push(f);});
  people.forEach(p=>{if(p.fam&&kidsOf.has(p.fam))kidsOf.get(p.fam).push(p);});
  kidsOf.forEach(a=>a.sort((x,y)=>(yearOf(x.birth)??1e9)-(yearOf(y.birth)??1e9)));
  const parentFam=p=>p&&p.fam?famById.get(p.fam):undefined;
  const dataIdx=new Map(people.map((p,i)=>[p.id,i]));

  const gen=new Map(),comps=[];
  for(const p0 of people){
    if(gen.has(p0.id))continue;
    const members=[],cf=new Set();
    gen.set(p0.id,0);
    const q=[p0.id];
    while(q.length){
      const id=q.shift();members.push(id);const g=gen.get(id);
      for(const f of famsOf.get(id)){
        cf.add(f);
        const o=f.a===id?f.b:f.a;
        if(!gen.has(o)){gen.set(o,g);q.push(o);}
        for(const c of kidsOf.get(f.id))if(!gen.has(c.id)){gen.set(c.id,g+1);q.push(c.id);}
      }
      const pf=parentFam(byId.get(id));
      if(pf){cf.add(pf);for(const par of [pf.a,pf.b])if(!gen.has(par)){gen.set(par,g-1);q.push(par);}}
    }
    const mg=Math.min(...members.map(m=>gen.get(m)));
    members.forEach(m=>gen.set(m,gen.get(m)-mg));
    members.sort((a,b)=>dataIdx.get(a)-dataIdx.get(b));
    comps.push({members,fams:[...cf]});
  }

  const pos=new Map(),famGeo=new Map(),kidEdges=[],groupsOut=[],groupOf=new Map();
  let cursor=0,maxGen=0;
  for(const comp of comps){
    const unitOf=new Map(),units=[];
    const same=id=>famsOf.get(id).filter(f=>gen.get(f.a)===gen.get(f.b)).map(f=>({fam:f,other:f.a===id?f.b:f.a}));
    const fy=f=>yearOf(f.married)??yearOf(f.divorced)??0;
    const hasManual=f=>f.leftId&&(f.leftId===f.a||f.leftId===f.b);
    /* --- units: a person plus same-generation partners, laid out as one block --- */
    for(const id of comp.members){
      if(unitOf.has(id))continue;
      const set=[id],seen=new Set([id]);
      for(let i=0;i<set.length;i++)for(const {other} of same(set[i]))if(!seen.has(other)){seen.add(other);set.push(other);}
      let root=set[0],best=-1;
      for(const m of set){const d=same(m).length;if(d>best){best=d;root=m;}}
      const placed=new Set([root]),left=[],right=[];
      const grow=(x,side)=>{for(const {other} of same(x)){if(placed.has(other))continue;placed.add(other);(side<0?left:right).push(other);grow(other,side);}};
      const rl=same(root).sort((a,b)=>{const ea=a.fam.status==='ex',eb=b.fam.status==='ex';if(ea!==eb)return ea?-1:1;return ea?fy(b.fam)-fy(a.fam):fy(a.fam)-fy(b.fam);});
      for(const {fam,other} of rl){
        if(placed.has(other))continue;placed.add(other);
        const side=fam.leftId===other?-1:fam.leftId===root?1:(fam.status==='ex'?-1:1);
        (side<0?left:right).push(other);grow(other,side);
      }
      const seq=[...left.reverse(),root,...right];
      const manual=set.some(m=>same(m).some(({fam})=>hasManual(fam)));
      const u={id:units.length,gen:gen.get(id),members:seq,def:[...seq],w:seq.length*CW+(seq.length-1)*PG,x:0,manual,pf:null,pu:null,anchor:null,sec:[],grp:'',cands:[],ci:0,nat:0,rank:0};
      seq.forEach(m=>unitOf.set(m,u));units.push(u);
    }
    const G=Math.max(...units.map(u=>u.gen));
    /* --- each unit hangs under ONE primary parent family; the other partner's parents just pull.
           Which one is a search variable, so a couple can sit between both sets of siblings. --- */
    const setPrimary=(u,k)=>{
      const c=u.cands[k];u.ci=k;
      u.pf=c.pf;u.pu=c.pu;u.anchor=c.m;u.grp=c.pf.id;
      u.sec=[...new Set(u.members.map(m=>parentFam(byId.get(m))).filter(f=>f&&f!==u.pf))];
      u.nat=(yearOf(byId.get(c.m).birth)??1e9)+dataIdx.get(c.m)*1e-4;
    };
    for(const u of units){
      let c=[];
      for(const m of u.members){
        const pf=parentFam(byId.get(m));if(!pf)continue;
        const pu=unitOf.get(pf.a);
        if(!pu||unitOf.get(pf.b)!==pu||pu.gen!==u.gen-1)continue;
        c.push({m,pf,pu});
      }
      c.sort((a,b)=>kidsOf.get(b.pf.id).length-kidsOf.get(a.pf.id).length||famIdx.get(a.pf.id)-famIdx.get(b.pf.id));
      const pinned=c.filter(x=>typeof byId.get(x.m).ord==='number');
      if(pinned.length)c=pinned.slice(0,1);
      u.cands=c;
      if(c.length){setPrimary(u,0);u.rank=u.nat;}
      else{u.sec=[...new Set(u.members.map(m=>parentFam(byId.get(m))).filter(Boolean))];u.grp='r'+u.id;}
    }
    const groupMap=new Map(),groupList=[];
    const rebuildGroups=()=>{
      groupMap.clear();groupList.length=0;
      for(const u of units){
        if(!u.pf)continue;
        let gm=groupMap.get(u.pu.id);if(!gm){gm=new Map();groupMap.set(u.pu.id,gm);}
        let g=gm.get(u.pf.id);if(!g){g={fam:u.pf,pu:u.pu,units:[],manual:false};gm.set(u.pf.id,g);groupList.push(g);}
        g.units.push(u);
      }
      const ordOf=u=>byId.get(u.anchor).ord;
      for(const g of groupList){
        g.manual=g.units.some(u=>typeof ordOf(u)==='number');
        g.units.sort((a,b)=>{
          if(g.manual){const oa=typeof ordOf(a)==='number'?ordOf(a):1e9,ob=typeof ordOf(b)==='number'?ordOf(b):1e9;if(oa!==ob)return oa-ob;}
          return a.rank-b.rank||a.id-b.id;
        });
      }
    };
    rebuildGroups();
    const groupsOfUnit=u=>{const gm=groupMap.get(u.id);return gm?[...gm.values()]:[];};
    let rootUnits=units.filter(u=>!u.pf);
    const rootOf=new Map();
    const mark=(u,r)=>{if(rootOf.has(u.id))return;rootOf.set(u.id,r);for(const g of groupsOfUnit(u))for(const c of g.units)mark(c,r);};
    /* --- geometry helpers --- */
    const off=(u,m)=>(u.members.indexOf(m)-(u.members.length-1)/2)*(CW+PG);
    const cx=m=>{const u=unitOf.get(m);return u.x+off(u,m);};
    const jx=f=>(cx(f.a)+cx(f.b))/2;
    const gap=(a,b)=>UG+(a.grp===b.grp?0:GG);
    let order=[];
    const buildOrder=()=>{
      const o=Array.from({length:G+1},()=>[]);
      const seenU=new Set();
      const visit=u=>{
        if(seenU.has(u.id))return;seenU.add(u.id);o[u.gen].push(u);
        const idx=g=>(u.members.indexOf(g.fam.a)+u.members.indexOf(g.fam.b))/2;
        for(const g of groupsOfUnit(u).sort((a,b)=>idx(a)-idx(b)))for(const c of g.units)visit(c);
      };
      rootUnits.forEach(visit);units.forEach(visit);
      return o;
    };
    const pack=()=>{
      for(const arr of order){
        let tot=arr.reduce((s,u)=>s+u.w,0);for(let i=1;i<arr.length;i++)tot+=gap(arr[i-1],arr[i]);
        let x=-tot/2;arr.forEach((u,i)=>{if(i)x+=gap(arr[i-1],u);u.x=x+u.w/2;x+=u.w;});
      }
    };
    const upKey=u=>{let s=0,n=0;for(const m of u.members){const pf=parentFam(byId.get(m));if(pf){const w=pf===u.pf?2:1;s+=w*(jx(pf)-off(u,m));n+=w;}}return n?s/n:null;};
    const downKey=u=>{let s=0,n=0;for(const m of u.members)for(const f of famsOf.get(m)){const ks=kidsOf.get(f.id);if(!ks.length)continue;const mk=ks.reduce((t,k)=>t+cx(k.id),0)/ks.length;const oa=u.members.includes(f.a)?off(u,f.a):off(u,m),ob=u.members.includes(f.b)?off(u,f.b):off(u,m);s+=mk-(oa+ob)/2;n++;}return n?s/n:null;};
    const placeGen=(g,fn)=>{
      const arr=order[g],n=arr.length;if(!n)return;
      const c=[0];for(let i=1;i<n;i++)c[i]=c[i-1]+(arr[i-1].w+arr[i].w)/2+gap(arr[i-1],arr[i]);
      const z=arr.map((u,i)=>(fn(u)??u.x)-c[i]);
      const blocks=[];
      for(const v of z){blocks.push({s:v,n:1});while(blocks.length>1){const b=blocks[blocks.length-1],a=blocks[blocks.length-2];if(a.s/a.n>b.s/b.n){a.s+=b.s;a.n+=b.n;blocks.pop();}else break;}}
      let i=0;for(const b of blocks){const m=b.s/b.n;for(let k=0;k<b.n;k++){arr[i].x=m+c[i];i++;}}
    };
    const settle=n=>{for(let it=0;it<n;it++){
      for(let g=1;g<=G;g++)placeGen(g,u=>upKey(u)??downKey(u));
      for(let g=G-1;g>=0;g--)placeGen(g,u=>downKey(u)??upKey(u));
    }};
    /* A: put each partner on the side their own parents are on (unless swapped by hand) */
    const orient=()=>{
      let changed=false;
      for(const u of units){
        if(u.manual||u.members.length!==2)continue;
        const cost=arr=>{let c=0;arr.forEach((m,i)=>{const pf=parentFam(byId.get(m));if(pf)c+=Math.abs(u.x+(i-0.5)*(CW+PG)-jx(pf));});return c;};
        const rev=[...u.def].reverse();
        const want=cost(rev)<cost(u.def)-1?rev:u.def;
        if(want[0]!==u.members[0]){u.members=[...want];changed=true;}
      }
      return changed;
    };
    /* B (seed): order siblings to suit their in-law pulls */
    const reorderGroups=()=>{
      for(const g of groupList){
        const n=g.units.length;
        if(g.manual||n<2)continue;
        const base=[...g.units].sort((a,b)=>a.nat-b.nat||a.id-b.id);
        const tg=base.map(u=>u.sec.length?u.sec.reduce((s,f)=>s+jx(f),0)/u.sec.length:null);
        if(tg.every(t=>t===null)){base.forEach(u=>{u.rank=u.nat;});continue;}
        const ws=base.map(u=>u.w),total=ws.reduce((a,b)=>a+b,0)+UG*(n-1),c0=jx(g.fam)-total/2;

let anim=null;
const cancelAnim=()=>{if(anim){cancelAnimationFrame(anim);anim=null;}};
function visible(){
  const r=stage.getBoundingClientRect();
  const mob=matchMedia('(max-width:760px)').matches&&panel.classList.contains('open');
  return {w:r.width,h:mob?r.height*0.44:r.height};
}
function animateTo(t,ms=380){
  cancelAnim();const s={...v},st=performance.now();
  const step=now=>{const u=Math.min(1,(now-st)/ms),e=1-Math.pow(1-u,3);v.x=s.x+(t.x-s.x)*e;v.y=s.y+(t.y-s.y)*e;v.k=s.k+(t.k-s.k)*e;applyView();anim=u<1?requestAnimationFrame(step):null;};
  anim=requestAnimationFrame(step);
}
function fitTarget(){
  const b=L.bounds,vis=visible();
  if(!b.w)return {x:vis.w/2,y:vis.h/2,k:1};
  const pad=50,k=Math.max(0.05,Math.min(1.1,(vis.w-pad*2)/b.w,(vis.h-pad*2)/b.h));
  return {k,x:(vis.w-b.w*k)/2-b.x*k,y:(vis.h-b.h*k)/2-b.y*k};
}
function fitView(animate){const t=fitTarget();if(animate)animateTo(t);else{cancelAnim();v={...t};applyView();}}
function centerTarget(id,k){const p=L.pos.get(id),vis=visible();return {k,x:vis.w/2-p.x*k,y:vis.h/2-p.y*k};}

  if(sx<mx||sx>vis.w-mx||sy<my||sy>vis.h-my)animateTo(centerTarget(id,v.k));
}
function zoomAt(cx,cy,f){const k=Math.min(3,Math.max(0.05,v.k*f)),r=k/v.k;v.x=cx-(cx-v.x)*r;v.y=cy-(cy-v.y)*r;v.k=k;applyView();}

const ptrs=new Map();let drag=null,pinch=null;
const rel=e=>{const r=stage.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
svg.addEventListener('pointerdown',e=>{
  svg.setPointerCapture(e.pointerId);cancelAnim();
  ptrs.set(e.pointerId,rel(e));
  if(ptrs.size===1){drag={sx:e.clientX,sy:e.clientY,vx:v.x,vy:v.y,moved:false,target:e.target.closest('[data-id]')?.dataset.id||null};}
  else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,k0:v.k,vx:v.x,vy:v.y,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};
    if(drag)drag.moved=true;
  }
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,rel(e));
  if(ptrs.size===2&&pinch){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    const k=Math.min(3,Math.max(0.05,pinch.k0*d/pinch.d0)),wx=(pinch.cx-pinch.vx)/pinch.k0,wy=(pinch.cy-pinch.vy)/pinch.k0;
    v.k=k;v.x=cx-wx*k;v.y=cy-wy*k;applyView();
  }else if(drag&&ptrs.size===1){
    const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;svg.classList.add('dragging');}
    if(drag.moved){v.x=drag.vx+dx;v.y=drag.vy+dy;applyView();}
  }
});
function endPtr(e,cancel){
  if(!ptrs.has(e.pointerId))return;

  if(ptrs.size<2)pinch=null;
  if(ptrs.size===0){
    svg.classList.remove('dragging');
    if(drag&&!drag.moved&&!cancel){drag.target?select(drag.target,true):select(null);}
    drag=null;
  }
}

svg.addEventListener('pointercancel',e=>endPtr(e,true));

  }
});

function guessLast(kind,p){
  if(!p)return '';
  const own=p.unknown?'':p.last;
  const dv=id=>{const el=dlg.querySelector('#'+id);return el?el.value:'';};
  const fromFam=f=>{
    if(!f)return own;
    const ms=[byId(f.a),byId(f.b)].filter(x=>x&&x.gender==='M'&&!x.unknown&&x.last);
    if(ms.some(x=>x.id===p.id))return own;
    return ms.length?ms[0].last:own;
  };
  if(kind==='child')return fromFam(famById(dv('dFam')));
  if(kind==='sibling'){
    const v=dv('dFam');
    if(!v||v==='unknown')return own;
    if(v.startsWith('new:')){const q=byId(v.slice(4));return q&&q.gender==='M'&&q.last?q.last:own;}
    return fromFam(famById(v));
  }
  if(kind==='parent')return dv('dGender')==='F'?'':own;
  return '';
}

dlg.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='radio'){e.preventDefault();submitAdd();}});
dlg.addEventListener('click',e=>{
  if(e.target===dlg){dlg.close();return;}
  const b=e.target.closest('[data-d]');if(!b)return;
  if(b.dataset.d==='cancel')dlg.close();else if(b.dataset.d==='ok')submitAdd();
});
function submitAdd(){
  const kind=dlg.dataset.kind,pid=dlg.dataset.pid;
  const mode=dlg.querySelector('[name=mode]:checked').value;
  const val=id=>{const el=dlg.querySelector('#'+id);return el?el.value:'';};
  let newId=null;
  const ok=act(()=>{
    const p=pid?byId(pid):null;
    const fail=m=>{dlg.querySelector('#dErr').textContent=m;return false;};
    const getPerson=()=>mode==='ex'?byId(val('dPerson')):mkPerson({first:val('dFirst'),middle:val('dMiddle'),last:val('dLast'),gender:val('dGender'),birth:val('dBirth')});
    if(kind==='person'){newId=getPerson().id;return;}
    if(kind==='partner'){
      const o=getPerson();
      mkFam(p.id,o.id,val('dStatus')||'current',val('dMarried').trim());newId=o.id;return;
    }
    if(kind==='child'){
      let fid=val('dFam');
      if(mode==='ex'){const c=byId(val('dPerson'));const f=famById(fid);if(f&&wouldCycle(c.id,f))return fail('That would make someone their own ancestor.');}
      if(fid==='__new'){const ph=mkPlaceholder(opposite(p.gender));fid=mkFam(p.id,ph.id).id;}
      const c=getPerson();c.fam=fid;c.rel=val('dRel')||'birth';newId=c.id;return;
    }
    if(kind==='parent'){
      const pf=famById(p.fam);
      if(pf){
        const slot=[pf.a,pf.b].find(id=>byId(id).unknown);
        if(!slot)return fail('Both parents are already recorded.');
        const o=getPerson();
        if([pf.a,pf.b].includes(o.id))return fail('That person is already a parent.');
        if(slot===pf.a)pf.a=o.id;else pf.b=o.id;
        newId=o.id;return;
      }
      const o=getPerson();
      const ph=mkPlaceholder(opposite(o.gender));
      const f=mkFam(o.id,ph.id);p.fam=f.id;p.rel='birth';newId=o.id;return;
    }
    if(kind==='sibling'){
      let fid=val('dFam');
      if(fid==='unknown'){const a=mkPlaceholder('F'),b=mkPlaceholder('M');const f=mkFam(a.id,b.id);p.fam=f.id;p.rel='birth';fid=f.id;}
      else if(fid.startsWith('new:')){const q=fid.slice(4),ph=mkPlaceholder(opposite(byId(q).gender));fid=mkFam(q,ph.id).id;}
      if(mode==='ex'){const s=byId(val('dPerson')),f=famById(fid);if(wouldCycle(s.id,f))return fail('That would make someone their own ancestor.');}
      const s=getPerson();s.fam=fid;s.rel='birth';newId=s.id;return;
    }
  });
  if(ok){dlg.close();select(newId,true);}
}
$('#bAdd').onclick=()=>openAdd('person',null);
$('#bFirst').onclick=()=>openAdd('person',null);

/* ---------- search ---------- */
const q=$('#q'),qres=$('#qres');
function runSearch(){
  const t=q.value.trim().toLowerCase();
  if(!t){qres.hidden=true;return;}
  const hits=S.people.filter(p=>!p.unknown&&fullName(p).toLowerCase().includes(t)).slice(0,8);
  qres.innerHTML=hits.length?hits.map(p=>`<button data-id="${p.id}">${esc(fullName(p))} <small>${esc(lifeText(p))}</small></button>`).join(''):'<button disabled>No matches</button>';
  qres.hidden=false;
}
function pick(id){qres.hidden=true;q.value='';q.blur();select(id,false);animateTo(centerTarget(id,Math.max(v.k,0.9)));}
q.addEventListener('input',runSearch);
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=qres.querySelector('button[data-id]');if(b)pick(b.dataset.id);}if(e.key==='Escape'){qres.hidden=true;q.value='';}});
qres.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)pick(b.dataset.id);});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))qres.hidden=true;if(!e.target.closest('#menu'))$('#menu').open=false;});

/* ---------- title, undo, keyboard ---------- */
$('#title').addEventListener('input',e=>{S.title=e.target.value;persist();});
$('#bUndo').onclick=doUndo;
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();doUndo();}
  if(e.key==='Escape'&&!dlg.open&&document.activeElement===document.body)select(null);
});

/* ---------- backup, restore, export ---------- */
const xdlg=document.createElement('dialog');document.body.appendChild(xdlg);
function markBackedUp(){meta.lastBackup=Date.now();meta.changes=0;meta.snooze=0;saveMeta();$('#banner').hidden=true;}
async function copyFrom(ta){
  try{await navigator.clipboard.writeText(ta.value);return true;}catch(e){}
  try{ta.focus();ta.select();return document.execCommand('copy');}catch(e){return false;}
}
function openBackup(){
  const text=JSON.stringify({app:'family-tree',version:1,...S},null,2);
  xdlg.style.width='';
  xdlg.innerHTML=`<div class="dbox"><h3>Back up your tree</h3><p class="muted" style="margin:6px 0 10px">Copy this text and keep it in a note or an email to yourself. To restore, use File → Restore and paste it back in.</p><textarea id="xText" readonly rows="8" style="font:11px/1.4 monospace;min-height:150px"></textarea><div id="xMsg" class="muted" style="min-height:18px;margin-top:6px"></div><div class="dact"><button class="btn" data-x="close">Close</button><button class="btn primary" data-x="copy">Copy to clipboard</button></div></div>`;
  const ta=xdlg.querySelector('#xText'),msg=xdlg.querySelector('#xMsg');ta.value=text;
  xdlg.onclick=async e=>{
    if(e.target===xdlg){xdlg.close();return;}
    const b=e.target.closest('[data-x]');if(!b)return;
    if(b.dataset.x==='close')xdlg.close();
    else if(b.dataset.x==='copy'){
      if(await copyFrom(ta)){msg.textContent='Copied. Paste it somewhere safe.';markBackedUp();}
      else{msg.textContent='Your viewer blocked copying. Click in the box and press Ctrl/Cmd+A, then Ctrl/Cmd+C.';ta.focus();ta.select();}
    }
  };
  xdlg.showModal();ta.focus();ta.select();
}
async function restoreFrom(text){
  try{
    const d=sanitize(JSON.parse(text));
    if(!d)throw new Error();
    if(!await ask(`Replace the current tree with this backup (${d.people.length} people)? You can undo this.`,'Replace'))return;
    snap();S=d;sel=null;persist();L=null;render();renderPanel();fitView(false);
    if(xdlg.open)xdlg.close();
  }catch(err){ask('That doesn\'t look like a family tree backup.','OK');}
}
function openRestore(){
  xdlg.style.width='';
  xdlg.innerHTML=`<div class="dbox"><h3>Restore from backup</h3><p class="muted" style="margin:6px 0 10px">Paste your backup text below, or choose a backup file.</p><textarea id="xText" rows="8" placeholder="Paste backup text here" style="font:11px/1.4 monospace;min-height:150px"></textarea><div class="dact"><button class="btn" data-x="close">Close</button><button class="btn" data-x="file">Choose file…</button><button class="btn primary" data-x="go">Restore</button></div></div>`;
  xdlg.onclick=e=>{
    if(e.target===xdlg){xdlg.close();return;}
    const b=e.target.closest('[data-x]');if(!b)return;
    if(b.dataset.x==='close')xdlg.close();
    else if(b.dataset.x==='file')$('#file').click();
    else if(b.dataset.x==='go'){const t=xdlg.querySelector('#xText').value.trim();if(t)restoreFrom(t);}
  };
  xdlg.showModal();xdlg.querySelector('#xText').focus();
}
function openImage(url,name){
  xdlg.style.width='min(760px,94vw)';
  xdlg.innerHTML=`<div class="dbox"><h3>Your tree as an image</h3><p class="muted" style="margin:6px 0 10px">Right-click (or long-press) the picture to save or copy it. </p><div style="max-height:55vh;overflow:auto;border:1px solid var(--rule);border-radius:8px"><img src="${url}" alt="Family tree" style="width:100%;display:block"></div><div class="dact"><button class="btn" data-x="close">Close</button></div></div>`;
  xdlg.onclick=e=>{if(e.target===xdlg||e.target.closest('[data-x=close]'))xdlg.close();};
  xdlg.showModal();
}
function checkBanner(){
  if(meta.changes>=8&&meta.changes>=meta.snooze){
    $('#bannerTxt').textContent=`You've made ${meta.changes} changes since your last backup. Your tree lives in this browser only, so a quick copy of your backup keeps it safe.`;
    $('#banner').hidden=false;
  }
}
$('#bBackup').onclick=openBackup;
$('#bLater').onclick=()=>{meta.snooze=meta.changes+8;saveMeta();$('#banner').hidden=true;};
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>restoreFrom(r.result);r.readAsText(f);
});
function exportSvg(){
  const b=L.bounds,pad=70,top=S.title?90:0,w=Math.ceil(b.w+pad*2),h=Math.ceil(b.h+pad*2+top);
  const title=S.title?`<text x="${w/2}" y="${pad+30}" text-anchor="middle" font-size="34" font-style="italic" font-weight="600" fill="#3a2e22" ${FA}>${esc(S.title)}</text>`:'';
  const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="#f4ecd8"/>${title}<g transform="translate(${pad-b.x} ${pad+top-b.y})">${markup(L,null)}</g></svg>`;
  return {s,w,h};
}
function exportPng(){
  if(!L.pos.size)return;
  const {s,w,h}=exportSvg(),scale=Math.min(2,7000/w,7000/h);
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);
    const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    openImage(c.toDataURL('image/png'),(S.title||'family-tree').replace(/[^\w\- ]+/g,'')+'.png');
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}
function printTree(){
  if(!L.pos.size)return;
  const {s,w,h}=exportSvg();
  const pa=document.createElement('div');pa.id='printArea';pa.innerHTML=s;document.body.appendChild(pa);
  const st=document.createElement('style');st.textContent=`@page{size:${w>=h?'landscape':'portrait'};margin:8mm}`;document.head.appendChild(st);
  const done=()=>{pa.remove();st.remove();window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),80);
}
$('#menu').addEventListener('click',async e=>{
  const b=e.target.closest('[data-m]');if(!b)return;
  $('#menu').open=false;
  const m=b.dataset.m;
  if(m==='backup')openBackup();
  else if(m==='restore')openRestore();
  else if(m==='png')exportPng();
  else if(m==='print')printTree();
  else if(m==='sample'){if(S.people.length&&!await ask('Replace the current tree with the sample family? You can undo this.','Replace'))return;snap();S=sampleData();sel=null;persist();L=null;render();renderPanel();fitView(false);}
  else if(m==='reset'){act(()=>{S.people.forEach(x=>{x.ord=null;});S.fams.forEach(f=>{f.leftId=null;});});}
  else if(m==='clear'){if(!await ask('Clear the whole tree? You can undo this, but a backup first is wise.','Clear everything',true))return;snap();S={title:S.title,people:[],fams:[]};sel=null;persist();render();renderPanel();fitView(false);}
});

/* ---------- start ---------- */
render();fitView(false);checkBanner();
window.addEventListener('resize',()=>{if(!sel)fitView(false);});
</script>
