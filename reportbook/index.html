<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reportbook prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
/*
VOICE: calm, exact school office tool: a well-kept mark book, not a flashy dashboard
IDEA: the teacher's mark book and the pupil's report card, side by side
PICTURE: the live roster grid + comment card is the picture; pupil page leads with a big cycle switcher
COLOUR and TYPE: off-white, #000237 ink, #00bdff solid pop boxes, crimson only for problems; DM Sans, Fraunces wordmark
LAYOUT: ink header band; content max 1240px; two columns for writing above 980px, stacked below
*/
:root{color-scheme:light dark;--bg:light-dark(#fafaf7,#05081f);--panel:light-dark(#ffffff,#0c1033);--ink:light-dark(#000237,#eef1ff);--mut:light-dark(#575b7c,#a4a9cf);--line:light-dark(#e2e3eb,#242a5c);--pop:#00bdff;--popink:#000237;--soft:light-dark(#e2f6ff,#0a2747);--crim:light-dark(#dc143c,#ff6b86);--crims:light-dark(#fdeaee,#3b0d1b);--ok:light-dark(#08794f,#4fd6a0);--oks:light-dark(#e0f4ea,#0b3324);--amb:light-dark(#8a5800,#f2b84b);--ambs:light-dark(#fdf2dc,#3a2a08)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(20px,3vw,40px) max(4vw,16px)}
h1{font-size:clamp(26px,3.2vw,36px);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;line-height:1.15;margin:0}
h3{font-size:16px;margin:0 0 6px}
.sub{color:var(--mut);margin:4px 0 0;font-size:15px}
/* header */
.top{background:#000237;color:#fff}
.top .in{max-width:1240px;margin:0 auto;padding:12px max(4vw,16px);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.mark{font-family:Fraunces,Georgia,serif;font-size:24px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.mark i{width:26px;height:26px;border-radius:6px;background:var(--pop);display:inline-grid;place-items:center;font-style:normal;color:#000237;font:700 15px "DM Sans"}
.nav{display:flex;background:#ffffff14;border-radius:999px;padding:3px;margin-right:auto;overflow-x:auto;max-width:100%}
.nav button{border:0;background:none;color:#c9ccf0;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:38px;white-space:nowrap;flex:none}
.nav button:hover:not(.on){color:#fff}
.nav button.on{background:var(--pop);color:#000237;font-weight:600}
.role{display:flex;background:#ffffff14;border-radius:999px;padding:3px}
.role button{border:0;background:none;color:#c9ccf0;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:38px}
.role button.on{background:var(--pop);color:#000237;font-weight:600}
.proto{background:var(--soft);font-size:13px;color:var(--ink)}
.proto .in{max-width:1240px;margin:0 auto;padding:6px max(4vw,16px);display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.proto button{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
/* bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.pop{background:var(--pop);color:var(--popink);border-color:var(--pop);font-weight:600}
.btn.ink{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.back{display:inline-block;margin-bottom:14px;color:var(--mut);cursor:pointer;background:none;border:0;padding:6px 0;min-height:36px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.chip{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--soft);white-space:nowrap}
.chip.ok{background:var(--oks);color:var(--ok)}.chip.amb{background:var(--ambs);color:var(--amb)}.chip.crim{background:var(--crims);color:var(--crim)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--pop);border-radius:99px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end}
.muted{color:var(--mut)}
.small{font-size:13px}
/* teacher home */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:16px;margin-top:22px}
.set{padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left}
.set:hover{border-color:var(--ink)}
.set .big{font-size:30px;font-weight:700;line-height:1}
.set .done{background:var(--pop);color:var(--popink);border-color:var(--pop)}
.deadline{display:inline-flex;gap:10px;align-items:center;background:var(--soft);color:var(--ink);min-height:44px;padding:8px 14px;border-radius:10px;font-weight:600;margin-top:14px}
.past{margin-top:34px}
.past li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.past ul{list-style:none;margin:0;padding:0}
/* writing view */
.whead{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.saved{font-size:13px;color:var(--ok);margin-right:6px}
.saved.busy{color:var(--mut)}
.wgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media(min-width:980px){.wgrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}.editor{position:sticky;top:12px}}
.tablecard{padding:6px 0 0;overflow:hidden}
table{border-collapse:collapse;width:100%}
.roster th{font-size:13px;color:var(--mut);font-weight:500;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.roster td{padding:4px 12px;border-bottom:1px solid var(--line)}
.roster tr.on td{background:var(--soft)}
.roster .g{width:74px;text-align:center}
.roster .st{width:60px;text-align:center}
.pname{background:none;border:0;padding:8px 0;cursor:pointer;text-align:left;font-weight:500;min-height:40px}
.pname:hover{text-decoration:underline}
.form{font-size:12px;color:var(--mut);margin-left:8px;white-space:nowrap}
.gin{width:52px;height:38px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:600;font-size:16px;text-transform:uppercase}
.gin:focus{border-color:var(--pop);outline:2px solid var(--pop);outline-offset:0}
.gin.bad{border-color:var(--crim);background:var(--crims);color:var(--crim)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.part{border-color:var(--pop);background:linear-gradient(90deg,var(--pop) 50%,transparent 50%)}
.dot.done{border-color:var(--pop);background:var(--pop)}
.hint{font-size:13px;color:var(--mut);padding:10px 14px;margin:0}
.editor{padding:20px;display:flex;flex-direction:column;gap:12px}
.ehead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.lbl{font-weight:600;font-size:14px}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);resize:vertical;line-height:1.55;font-size:16px;min-height:200px}
textarea:focus{border-color:var(--pop);outline:2px solid var(--pop);outline-offset:0}
.wc{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:10px}
.wc .over{color:var(--crim);font-weight:600}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{font-size:14px;padding:8px 12px;border-radius:8px;background:var(--crims);color:var(--crim)}
.checks li.warn{background:var(--ambs);color:var(--amb)}
.checks li.good{background:var(--oks);color:var(--ok)}
.last{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:14px}
.last p{margin:6px 0 0;font-size:14px}
.minigrades{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mg{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--panel)}
.enav{display:flex;justify-content:space-between;align-items:center;gap:10px}
/* pupil page */
.ptop{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
.avatar{width:64px;height:64px;border-radius:16px;background:var(--pop);color:#000237;display:grid;place-items:center;font-weight:700;font-size:24px;flex:none}
.switch{display:flex;align-items:stretch;gap:0;margin:24px 0 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.switch button{border:0;background:none;width:64px;font-size:28px;cursor:pointer;min-height:72px}
.switch button:hover:not(:disabled){background:var(--soft)}
.switch button:disabled{opacity:.25;cursor:default}
.cname{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px;border-inline:1px solid var(--line)}
.cname b{font-size:clamp(20px,2.6vw,28px);line-height:1.1}
.cname span{font-size:14px;color:var(--mut)}
.cchips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px}
.cchips button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;min-height:36px}
.cchips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;margin-top:16px}
.subj{padding:16px;display:flex;flex-direction:column;gap:8px}
.subj header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.grades{display:flex;gap:6px;flex:none}
.gbox{min-width:44px;text-align:center;border-radius:8px;padding:4px 6px;background:var(--soft);line-height:1.1}
.gbox b{display:block;font-size:20px}.gbox small{font-size:11px;color:var(--mut)}
.gbox.a{background:var(--pop);color:#000237}.gbox.a small{color:#000237}
.subj p{margin:0;font-size:15px}
.linkish{background:none;border:0;padding:0;cursor:pointer;font-weight:700;font-size:17px;text-align:left}
.linkish:hover{text-decoration:underline}
.overtime{margin-top:30px;padding:16px 0 4px}
.overtime h3{padding:0 16px}
.ot{font-size:14px}
.ot th,.ot td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.ot th:first-child,.ot td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
.ot thead th{font-weight:500;color:var(--mut);font-size:13px}
.ot .cur{background:var(--soft)}
.lt{display:inline-block;width:30px;height:28px;line-height:28px;border-radius:6px;font-weight:700}
.lt.A{background:var(--pop);color:#000237}.lt.B{background:color-mix(in srgb,var(--pop) 55%,transparent)}.lt.C{background:color-mix(in srgb,var(--pop) 25%,transparent)}.lt.D{background:var(--ambs);color:var(--amb)}.lt.E{background:var(--crims);color:var(--crim)}
.scroll{overflow-x:auto}
.timeline{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.tl{padding:16px;display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px}
@media(max-width:640px){.tl{grid-template-columns:minmax(0,1fr)}}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px;margin-top:18px}
.pitem{padding:12px 14px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center}
.pitem:hover{border-color:var(--ink)}
.pitem .av{width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:700;flex:none}
.search{width:100%;max-width:420px;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--panel);font-size:16px;margin-top:16px}
/* admin */
.tbl th,.tbl td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
.tbl th{font-size:13px;color:var(--mut);font-weight:500}
.hero{padding:22px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin:22px 0}
@media(min-width:800px){.hero{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:center}}
.bignum{font-size:clamp(40px,6vw,64px);font-weight:700;line-height:1}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 22px}
.steps span{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--mut)}
.steps span.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps span.done{border-color:var(--pop);color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field select,.field input{min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--panel);font-weight:400;font-size:16px}
.namebox{font-size:clamp(22px,3vw,30px);font-weight:700;margin:20px 0 6px}
.copylist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.copylist label{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer}
.copylist label.on{border-color:var(--pop);box-shadow:0 0 0 2px var(--pop)}
.copylist input{width:20px;height:20px;accent-color:#00bdff}
.matrix th,.matrix td{padding:6px;border-bottom:1px solid var(--line);text-align:center;font-size:14px}
.matrix th:first-child,.matrix td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1;min-width:170px}
.matrix select{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;padding:0 6px;width:100%;min-width:118px}
.matrix select.off{color:var(--mut)}
.matrix select.full,.matrix select.fullExam{background:var(--soft);border-color:var(--pop)}
.mini{font-size:12px;background:none;border:1px solid var(--line);border-radius:6px;padding:3px 7px;cursor:pointer;margin-top:4px;color:var(--mut)}
.mini:hover{color:var(--ink);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.legend div{font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel)}
.legend b{display:block;font-size:13px}
.pf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:12px;margin:16px 0}
.pf .card{padding:16px}
.pf b{font-size:30px;display:block;line-height:1.1}
.issues{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.issues li{padding:10px 14px;border-radius:10px;font-size:15px}
.issues .err{background:var(--crims);color:var(--crim)}.issues .warn{background:var(--ambs);color:var(--amb)}.issues .fine{background:var(--oks);color:var(--ok)}
.wfoot{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.depts{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.depts button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px;font-size:14px}
.depts button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.files{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;overflow-x:auto;white-space:pre}
.checkrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.checkrow label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel);cursor:pointer;min-height:44px}
.checkrow input{width:18px;height:18px;accent-color:#00bdff}
/* modal + toast */
.modal{position:fixed;inset:0;background:#00023766;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:20;overflow-y:auto}
.modal.open{display:flex}
.mbox{background:var(--panel);border-radius:16px;max-width:760px;width:100%;padding:22px;box-shadow:0 20px 60px #0004}
.mbox h2{margin-bottom:6px}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.sumrow div{border-radius:12px;padding:12px;background:var(--bg);border:1px solid var(--line)}
.sumrow b{font-size:26px;display:block;line-height:1.1}
.sumrow .pop{background:var(--pop);border-color:var(--pop);color:#000237}
.dlist{list-style:none;margin:0 0 10px;padding:0;max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
.dlist li{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.dlist li:last-child{border-bottom:0}
.dlist .who{font-weight:600}
.dlist .was{color:var(--mut);text-decoration:line-through}
.dlist details{margin-top:4px}
.dlist summary{cursor:pointer;color:var(--mut)}
.conf{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.conf label{border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex:1 1 220px;cursor:pointer;font-size:13px}
.conf input{accent-color:#00bdff;margin-right:6px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#000237;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:30;max-width:min(92vw,560px);font-size:15px;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.report{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.report .rh{background:#000237;color:#fff;padding:16px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.report .rh b{font-family:Fraunces,Georgia,serif;font-size:22px}
.report .rs{padding:12px 18px;border-bottom:1px solid var(--line)}
.report .rs h4{margin:0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--pop);color:#000237;padding:6px 10px;border-radius:6px;font-size:15px}
.report .rs p{margin:8px 0 0;font-size:14px}
.settings{padding:14px 18px;margin:0 0 18px}
.settings summary{cursor:pointer;min-height:32px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.settings .fgrid{margin-top:10px}
.inline{display:flex;align-items:center;gap:8px}.inline input{width:120px}
.toggle{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:#00bdff;flex:none}
.dlist li.grp{background:var(--soft);font-weight:700;font-size:13px;padding:6px 14px}
.over{color:var(--crim);font-weight:600}
.banner{background:var(--soft);border-left:4px solid var(--pop);padding:12px 16px;border-radius:10px;margin-bottom:18px;font-size:15px}
.gc{padding:16px 18px;margin-bottom:18px;display:flex;flex-direction:column;gap:8px}
.gc textarea{min-height:84px}
.gtext{margin:0;font-size:15px;white-space:pre-wrap}
.warnt{color:var(--amb)}
.setname{font-variant-numeric:tabular-nums}
.gin.wide{width:150px;text-align:left;text-transform:none;font-weight:500;font-size:14px;padding:0 8px}
.lf{display:flex;flex-direction:column;gap:6px}
.lf textarea{min-height:110px}
.lf .over{color:var(--crim);font-weight:600}
.ctx{border-top:1px solid var(--line);padding:10px 0}
.ctx:first-of-type{border-top:0}
.ctx p{margin:6px 0 0;font-size:14px}
.tutorc{padding:16px;margin-top:16px}
.tutorc p{margin:8px 0 0}
.gcd summary{cursor:pointer;color:var(--mut);font-size:13px}
.gcd p{font-size:14px;color:var(--mut);margin:6px 0 0}
.exam{font-size:14px}
.gbox.d{min-width:40px}
.gbox.GD{background:var(--pop);color:#000237}.gbox.EX{background:color-mix(in srgb,var(--pop) 55%,transparent)}.gbox.M{background:color-mix(in srgb,var(--pop) 22%,transparent)}.gbox.WT{background:var(--ambs);color:var(--amb)}.gbox.E{background:var(--crims);color:var(--crim)}

<div class="proto"><div class="in"><span>Prototype: every pupil, member of staff and comment here is made up. Nothing is connected to iSAMS or My School Portal.</span><span class="row" style="gap:14px"><span id="build">Last build: 23 Nov 2026, 17:29</span><button data-act="reset">Reset sample data</button></span></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
{
const BUILD='23 Nov 2026, 17:29';
const SCORE_LABEL='School score';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261123);
const pick=a=>a[Math.floor(R()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const words=s=>(String(s||'').trim().match(/\S+/g)||[]).length;
const reName=n=>new RegExp('\\b'+n+'\\b');

/* ================= reference data ================= */
const DESC=[['E','Emerging'],['WT','Working towards'],['M','Meeting'],['EX','Exceeding'],['GD','Greater depth']];
const descName=c=>(DESC.find(d=>d[0]===c)||[])[1]||c;
function normDesc(v){v=String(v??'').trim();if(!v)return'';const u=v.toUpperCase().replace(/\s+/g,' ');const d=DESC.find(([c,n])=>c===u||n.toUpperCase()===u);return d?d[0]:v}
const FIELD={
  atl:{label:'Attitude to learning',short:'AtL',type:'num',hint:'1–5'},
  org:{label:'Organisation',short:'Org',type:'num',hint:'1–5'},
  achS:{label:'Achievement within the set',short:'Set',type:'desc',hint:'E / WT / M / EX / GD'},
  achY:{label:'Achievement within the year',short:'Year',type:'desc',hint:'E / WT / M / EX / GD'},
  exam:{label:'Exam percentage',short:'Exam %',type:'text',hint:'any text'},
  score:{label:SCORE_LABEL,short:'Score',type:'text',hint:'any text'},
  www:{label:'What went well',short:'WWW',type:'long'},
  ebi:{label:'Even better if',short:'EBI',type:'long'},
  tutor:{label:'Tutor comment',short:'Tutor',type:'long'}
};
const GRADEF=['atl','org','achS','achY'];
const DEFAULT_LIMITS={www:800,ebi:800,tutor:1200,general:600};
const LIMIT_LABEL={www:'What went well',ebi:'Even better if',tutor:'Tutor comment',general:'General comment'};
const chars=s=>String(s||'').length;
const lim=(c,f)=>((c&&c.limits)||DEFAULT_LIMITS)[f]??DEFAULT_LIMITS[f];
const genOn=c=>c.general??(c.kind!=='Y8');
const OPTS={
  none:{label:'—',fields:[]},
  grades:{label:'Grades',fields:[...GRADEF]},
  gradesReport:{label:'Grades + report',fields:[...GRADEF,'www','ebi']},
  gradesExamReport:{label:'Grades + exam + report',fields:[...GRADEF,'exam','score','www','ebi']},
  gradesExam:{label:'Grades + exam',fields:[...GRADEF,'exam','score']},
  examFeedback:{label:'Exam feedback',fields:['exam','score','www','ebi']},
  report:{label:'Report only',fields:['www','ebi']},
  tutor:{label:'Tutor comment',fields:['tutor']}
};
function valid(f,v,c){v=String(v??'').trim();if(!v)return true;const t=FIELD[f].type;if(t==='num')return/^[1-5]$/.test(v);if(t==='desc')return DESC.some(d=>d[0]===v);if(t==='long')return chars(v)<=lim(c,f);return true}
function normField(f,v){v=String(v??'').replace(/\r\n?/g,'\n').trim();const t=FIELD[f].type;if(t==='desc')return normDesc(v);if(t==='num')return v.replace(/\.0+$/,'');return v}

const SUBJ=[{name:'English',code:'Eng',by:'set'},{name:'Maths',code:'Mat',by:'set'},{name:'Science',code:'Sci'},{name:'French',code:'Fre'},{name:'History',code:'His'},{name:'Geography',code:'Geo'},{name:'Latin',code:'Lat',from:6},{name:'Religious Studies',code:'TPR'}];
const SUBJ_TEXT={English:'English',Maths:'maths',Science:'science',French:'French',History:'history',Geography:'geography',Latin:'Latin','Religious Studies':'RS'};
const TOPICS={Maths:['fractions','algebraic expressions','ratio','angles in polygons','solving equations','probability','area and perimeter'],English:['persuasive writing','poetry analysis','the class novel','descriptive writing','comprehension'],Science:['forces','separating mixtures','the solar system','electric circuits','habitats'],French:['describing family','the past tense','listening tasks','vocabulary','role plays'],History:['the Norman Conquest','source analysis','the Tudors','Victorian Britain','the Romans'],Geography:['rivers','map skills','weather and climate','volcanoes','settlements'],Latin:['the first declension','translation','verb endings','Roman myths','the imperfect tense'],'Religious Studies':['world religions','ethical questions','the parables','festivals of light','sacred texts']};
const STAFF={TAJ:'Mr Joshi',RPA:'Mrs Patel',HAR:'Mrs Hart',LOW:'Mr Lowe',DKO:'Dr Okafor',BYR:'Ms Byrne',MLA:'Mme Laurent',BEL:'Mr Bell',REI:'Miss Reid',ASH:'Mr Ashworth',CLA:'Revd Clarke',ABA:'Mr Abbott',RHU:'Mr Rhodes',KPA:'Mrs Parr',SWI:'Mrs Wilde',CFO:'Mr Ford',MDE:'Mrs Dean',JRO:'Mr Rowe',NGR:'Mrs Grey',LPO:'Mr Pole',HTA:'Ms Tate',EWE:'Mr West',BCO:'Mrs Cole',MFI:'Mr Finch',RDA:'Mrs Day',AKE:'Mr Kemp'};
function teacherFor(code,y,idx){switch(code){case'Mat':return y<=5?'RPA':y===8?(idx===0?'RPA':'TAJ'):(idx===0?'TAJ':'RPA');case'Eng':return y<=5?'HAR':(idx===0?'HAR':'LOW');case'Sci':return y<=6?'DKO':'BYR';case'Fre':return'MLA';case'His':return'BEL';case'Geo':return'REI';case'Lat':return'ASH';case'TPR':return'CLA'}}
const FORMS={2027:{5:['5TJ','5AB'],6:['6RH','6KP'],7:['7SW','7CF'],8:['8MD','8JR']},2026:{4:['4NG','4LP'],5:['5HT','5EW'],6:['6BC','6MF'],7:['7RD','7AK']}};
const TUTOR={'5TJ':'TAJ','5AB':'ABA','6RH':'RHU','6KP':'KPA','7SW':'SWI','7CF':'CFO','8MD':'MDE','8JR':'JRO','4NG':'NGR','4LP':'LPO','5HT':'HTA','5EW':'EWE','6BC':'BCO','6MF':'MFI','7RD':'RDA','7AK':'AKE'};
const ME='TAJ';

/* ================= pupils ================= */
const F_NAMES=['Amelia','Isla','Freya','Sophia','Ava','Grace','Lily','Evie','Ruby','Matilda','Aanya','Zara','Hannah','Imogen','Martha','Chloe','Esme','Priya','Olivia','Florence','Harriet','Maya','Niamh','Rosie','Beatrice','Clara','Daisy','Eliza','Iris','Jemima','Kitty','Lara','Mia','Nina','Orla','Phoebe','Elizabeth','Charlotte','Alexandra','Katherine','Margaret','Victoria','Arabella','Penelope'];
const M_NAMES=['Oliver','George','Arthur','Henry','Theo','Leo','Freddie','Alfie','Jack','Harry','Arjun','Rohan','Kai','Max','Felix','Hugo','Sebastian','Archie','Charlie','Edward','Finn','Jasper','Louis','Noah','Oscar','Rafe','Toby','William','Zain','Barnaby','Caspar','Dev','Ethan','Gabriel','Isaac','Jonathan','Alexander','Christopher','Thomas','Benjamin','Frederick','Nicholas','Maximilian','Ralph'];
const PREF={Elizabeth:'Libby',Charlotte:'Lottie',Alexandra:'Sasha',Katherine:'Kate',Margaret:'Maggie',Victoria:'Tori',Arabella:'Bella',Penelope:'Penny',Jonathan:'Jonny',Alexander:'Xander',Christopher:'Kit',Thomas:'Tom',Benjamin:'Ben',Frederick:'Fred',Nicholas:'Nico',Maximilian:'Maxi'};
const SURN=['Ashby','Bennett','Carter','Davies','Ellison','Fletcher','Gupta','Hughes','Iqbal','Jenkins','Khan','Lawson','Mehta','Nolan','Okoro','Palmer','Quinn','Reeves','Shah','Thornton','Underwood','Vaughan','Walsh','Young','Adeyemi','Blake','Chandra','Dalton','Evans','Forbes','Grant','Hale','Ingram','Jameson','Kerr','Lister','Morgan','Novak','Osei','Pearce','Rahman','Sinclair','Tran','Wells','Barker','Cole','Dunn','Foster','Lee','Smith'];
const pool=shuffle([...F_NAMES.map(n=>[n,'F']),...M_NAMES.map(n=>[n,'M'])]);
const PUPILS=[];let k=0;
for(const y of[5,6,7,8])for(let fi=0;fi<2;fi++)for(let i=0;i<10;i++){const[first,sex]=pool[k++];const p={id:String(210213+k*37),first,pref:PREF[first]||null,last:pick(SURN),sex,year:y,fi,ability:clamp(1+R()*4,1,5),off:{}};SUBJ.forEach(s=>p.off[s.name]=(R()-.5)*1.4);PUPILS.push(p)}
// make sure there is a Jonathan (Jonny) Smith somewhere, as in the example
{const j=PUPILS.find(p=>p.first==='Jonathan');if(j)j.last='Smith'}
const PUP=Object.fromEntries(PUPILS.map(p=>[p.id,p]));
const call=p=>p.pref||p.first;
const fullName=p=>`${p.last}, ${p.first}${p.pref?` (${p.pref})`:''}`;
const niceName=p=>`${call(p)} ${p.last}`;
const yearAt=(p,ay)=>p.year-(2027-ay);
const formAt=(p,ay)=>(FORMS[ay][yearAt(p,ay)]||[])[p.fi];
const pron=p=>p.sex==='F'?{he:'she',He:'She',his:'her',His:'Her',him:'her'}:{he:'he',He:'He',his:'his',His:'His',him:'him'};
const fillT=(t,p,o)=>t.replace(/\{(\w+)\}/g,(m,key)=>key==='N'?call(p):(o&&o[key]!==undefined)?o[key]:(pron(p)[key]??m));

/* ================= sets (iSAMS-style names) ================= */
const SETS=[],SET={},PSETS={};let sn=0;
function addSet(o){o.id='s'+(++sn);o.ids.sort((a,b)=>(PUP[a].last+PUP[a].first).localeCompare(PUP[b].last+PUP[b].first));SETS.push(o);SET[o.id]=o;o.ids.forEach(pid=>{(PSETS[o.ay+pid]=PSETS[o.ay+pid]||[]).push(o.id)});return o}
for(const ay of[2026,2027]){const yy=String(ay%100);
  for(const y of Object.keys(FORMS[ay]).map(Number)){const coh=PUPILS.filter(p=>yearAt(p,ay)===y);
    for(const s of SUBJ){if(s.from&&y<s.from)continue;
      if(y<=5){FORMS[ay][y].forEach((f,fi)=>{const t=teacherFor(s.code,y,fi);addSet({ay,year:y,subject:s.name,code:s.code,teacher:t,name:`${yy} ${f} ${s.code} ${t}`,ids:coh.filter(p=>p.fi===fi).map(p=>p.id)})})}
      else{const ranked=coh.slice().sort((a,b)=>(a.ability+(s.by==='set'?a.off[s.name]:0))-(b.ability+(s.by==='set'?b.off[s.name]:0)));const halves=[ranked.slice(0,10),ranked.slice(10)];
        halves.forEach((h,idx)=>{const t=teacherFor(s.code,y,idx);const name=s.by==='set'?`${yy} ${y}${s.code} ${t}`:`${yy} ${y}${'AB'[idx]} ${s.code} ${t}`;addSet({ay,year:y,subject:s.name,code:s.code,teacher:t,name,ids:h.map(p=>p.id)})})}}
    FORMS[ay][y].forEach((f,fi)=>addSet({ay,year:y,subject:'Tutor',code:'Tut',teacher:TUTOR[f],name:`${yy} ${f} Tutor group`,form:f,ids:coh.filter(p=>p.fi===fi).map(p=>p.id)}))}}
const roster=set=>set.ids.map(id=>PUP[id]);
const pupilSets=(p,ay)=>(PSETS[ay+p.id]||[]).map(id=>SET[id]);

/* ================= cycles ================= */
const MROWS=['English','Maths','Science','French','History','Geography','Latin','Religious Studies','Music (peri)','LAMDA','Tutor comment'];
const MYEARS=[3,4,5,6,7,8];
const ACAD=SUBJ.map(s=>s.name);
function matrixFor(kind){const m={};for(const r of MROWS){m[r]={};for(const y of MYEARS){let v='none';const acad=ACAD.includes(r)&&!(r==='Latin'&&y<6);
  if(kind==='Y8'){if(acad&&y===8)v='examFeedback'}
  else if(kind==='BLANK'){}
  else{if(acad)v=kind==='ME'?'gradesReport':kind==='SE'?'gradesExamReport':'grades';
    if((r==='Music (peri)'||r==='LAMDA')&&(kind==='ME'||kind==='SE'))v='report';
    if(r==='Tutor comment'&&['MH','ME','LE','SE'].includes(kind))v='tutor'}
  m[r][y]=v}}return m}
const KIND_LABEL={MH:'Grades + tutor comment',ME:'Grades + reports + tutor comment',LH:'Grades',LE:'Grades + tutor comment',SH:'Grades',SE:'Grades + exams + reports + tutor comment',Y8:'Year 8: exam results + WWW/EBI'};
const CYCLES=[
  ['m25h','Michaelmas Half Term 2025','Mich HT 25','MH',2026,'17 Oct 2025'],
  ['y8m25','Year 8 Exam Feedback, Michaelmas 2025','Y8 exams Nov 25','Y8',2026,'21 Nov 2025'],
  ['m25e','Michaelmas End of Term 2025','Mich End 25','ME',2026,'12 Dec 2025'],
  ['l26h','Lent Half Term 2026','Lent HT 26','LH',2026,'13 Feb 2026'],
  ['y8l26','Year 8 Exam Feedback, Lent 2026','Y8 exams Mar 26','Y8',2026,'6 Mar 2026'],
  ['l26e','Lent End of Term 2026','Lent End 26','LE',2026,'27 Mar 2026'],
  ['s26h','Summer Half Term 2026','Sum HT 26','SH',2026,'22 May 2026'],
  ['s26e','Summer End of Term 2026','Sum End 26','SE',2026,'3 Jul 2026'],
  ['m26h','Michaelmas Half Term 2026','Mich HT 26','MH',2027,'16 Oct 2026'],
  ['y8m26','Year 8 Exam Feedback, Michaelmas 2026','Y8 exams Nov 26','Y8',2027,'20 Nov 2026'],
  ['m26e','Michaelmas End of Term 2026','Mich End 26','ME',2027,null]
].map(([id,name,short,kind,ay,pub])=>({id,name,short,kind,ay,pub,status:pub?'Published':'Open',matrix:matrixFor(kind)}));
const CUR=CYCLES.find(c=>c.id==='m26e');Object.assign(CUR,{due:'Fri 4 Dec 2026',opens:'2026-11-16',deadline:'2026-12-04',proof:'2026-12-09',publish:'2026-12-12'});
let EXTRA=[];
const allCycles=()=>[...CYCLES,...EXTRA];
const CYC=id=>allCycles().find(c=>c.id===id);
const PAST=CYCLES.filter(c=>c.status==='Published');
function fieldsFor(c,set){const row=set.subject==='Tutor'?'Tutor comment':set.subject;return OPTS[(c.matrix[row]||{})[set.year]||'none'].fields}
const setsIn=(c,t)=>SETS.filter(s=>s.ay===c.ay&&fieldsFor(c,s).length&&(!t||s.teacher===t));
const hasGeneral=(c,set)=>set.subject!=='Tutor'&&genOn(c)&&fieldsFor(c,set).some(f=>f!=='tutor');
const optLabel=(c,set)=>{const row=set.subject==='Tutor'?'Tutor comment':set.subject;return OPTS[c.matrix[row][set.year]].label};

/* ================= text generators ================= */
const WWW=[['{N} has shown real confidence with {T}, and {his} written work is consistently accurate.','{N} grasps new ideas quickly, particularly in {T}, and explains {his} reasoning clearly.','{N}’s work on {T} was a highlight this term; {he} relishes a challenge.'],['{N} has made steady progress with {T} and is becoming more independent.','{N} is secure with {T} and contributes sensibly in class discussions.'],['{N} has persevered with {T} and {his} confidence is growing.','{N} has worked hard on {T} and is starting to use the key methods on {his} own.']];
const WWW2=['{His} contributions in class are thoughtful and frequent.','{He} is a focused and cooperative member of the class.','{He} settles quickly and always tries {his} best.'];
const EBI=['{N} should show {his} working clearly so that method marks are not lost.','{N} should check {his} answers carefully before moving on.','{N} should read each question twice before starting.','{N} should use subject vocabulary more precisely in written answers.','{N} should ask for help sooner when {he} is unsure.','{N} should review {his} notes on {T2} regularly to keep them fresh.'];
const TUT=['{N} has settled into the new school year {how}.','{He} is a kind and loyal friend to many in the form.','{He} has taken on the role of {role} with real enthusiasm.','{His} organisation has improved, though {he} should keep checking {his} planner each evening.','{He} has thrown {him}self into matches and activities this term.','It has been a pleasure to be {his} tutor this term, and I look forward to seeing {him} grow in confidence next term.'];
function genReport(p,subj,band,exam){const tp=shuffle(TOPICS[subj]);const o={T:tp[0],T2:tp[1]};
  if(exam)return{www:fillT(pick(['{N} answered the {T} questions particularly well.','{N} was well prepared for the {T} section of the paper.']),p,o)+' '+fillT(pick(WWW2),p,o),ebi:fillT('{N} should revise {T2} carefully before the next assessment.',p,o)};
  return{www:fillT(pick(WWW[band]),p,o)+' '+fillT(pick(WWW2),p,o),ebi:fillT(pick(EBI),p,o)}}
function genTutor(p,short){const o={how:pick(['quickly and happily','well after a slightly nervous start','with great confidence']),role:pick(['form captain','eco rep','library monitor','house rep'])};const lines=[TUT[0],...shuffle(TUT.slice(1,5))].slice(0,short?2:4).map(t=>fillT(t,p,o));if(!short)lines.push(fillT(TUT[5],p,o));return lines.join(' ')}
function genGeneral(subj){const t=shuffle(TOPICS[subj]);return`This term the class has covered ${t[0]}, ${t[1]} and ${t[2]}. We finished with a short assessment on ${t[2]}, and next term we move on to ${t[3]}.`}
function genExam(p,subj,a){const pc=()=>Math.round(clamp(96-(a-1)*14+(R()-.5)*12,22,99));const sc=()=>Math.round(clamp(130-(a-1)*11+(R()-.5)*10,70,141));
  if(subj==='Science')return{exam:`P1 ${pc()}% · P2 ${pc()}% · P3 ${pc()}%`,score:`Bio ${sc()} · Chem ${sc()} · Phys ${sc()}`};return{exam:pc()+'%',score:String(sc())}}
function genRecord(p,set,c,ci,fields){const s=set.subject,r={t:{}};
  if(s==='Tutor'){if(fields.includes('tutor'))r.tutor=genTutor(p,false);return r}
  const a=clamp(p.ability+p.off[s]+(R()-.5)*.8-ci*.04,1,5),band=a<2.3?0:a<3.6?1:2;
  if(fields.includes('atl')){r.atl=String(clamp(Math.round(a*.6+R()*1.8),1,5));r.org=String(clamp(Math.round(a*.5+R()*2.2),1,5));r.achY=DESC[clamp(4-Math.floor((a-1)/0.82),0,4)][0];r.achS=DESC[clamp(2+Math.round(-p.off[s]*1.6+(R()-.5)*1.4),0,4)][0]}
  if(fields.includes('exam'))Object.assign(r,genExam(p,s,a));
  if(fields.includes('www'))Object.assign(r,genReport(p,s,band,c.kind==='Y8'));
  return r}

/* ================= data ================= */
const DATA={},GEN={};
PAST.forEach((c,ci)=>{DATA[c.id]={};GEN[c.id]={};for(const set of setsIn(c)){const f=fieldsFor(c,set);DATA[c.id][set.id]={};set.ids.forEach(pid=>DATA[c.id][set.id][pid]=genRecord(PUP[pid],set,c,ci,f));if(hasGeneral(c,set))GEN[c.id][set.id]=genGeneral(set.subject)}});
const RATIO={RPA:1,HAR:.85,LOW:.6,DKO:.45,BYR:.8,MLA:.3,BEL:1,REI:.7,ASH:.2,CLA:.5,ABA:.4,RHU:.1,KPA:.6,SWI:0,CFO:.3,MDE:.5,JRO:.2};
const MYRATIO={'27 6Mat TAJ':.7,'27 7Mat TAJ':.25,'27 8Mat TAJ':0,'27 5TJ Tutor group':.3};
function freshOpen(){const D={},G={};const c=CUR,ci=PAST.length;const now=Date.now()-86400000*3;
  for(const set of setsIn(c)){const f=fieldsFor(c,set),n=set.ids.length,ratio=MYRATIO[set.name]??RATIO[set.teacher]??.5;const done=Math.round(n*ratio),part=ratio<1&&ratio>0?Math.max(1,Math.round(n*.15)):0;D[set.id]={};
    set.ids.forEach((pid,i)=>{const full=genRecord(PUP[pid],set,c,ci,f),r={t:{}};
      if(i<done)f.forEach(x=>r[x]=full[x]);else if(i<done+part){if(set.subject==='Tutor')r.tutor=genTutor(PUP[pid],true);else GRADEF.forEach(x=>{if(f.includes(x))r[x]=full[x]})}
      f.forEach(x=>{if(r[x])r.t[x]=now});D[set.id][pid]=r});
    if(hasGeneral(c,set)&&ratio>.4)G[set.id]=genGeneral(set.subject)}
  // deliberate slips in 27 6Mat TAJ, to show the checker
  const s6=SETS.find(s=>s.name==='27 6Mat TAJ');if(s6){const ros=roster(s6),done=ros.slice(0,Math.round(ros.length*.7));const girl=done.find(p=>p.sex==='F');const other=ros.find(p=>p!==girl&&p.sex==='M');
    if(girl&&other){const r=D[s6.id][girl.id];r.www=`${call(other)} has shown real confidence with ratio, and his written work is consistently accurate. He is a focused and cooperative member of the class.`}
    const prefP=done.find(p=>p.pref&&p!==girl);if(prefP){D[s6.id][prefP.id].www=`${prefP.first} has made steady progress with fractions and is becoming more independent. ${pron(prefP).He} settles quickly and always tries ${pron(prefP).his} best.`}}
  return{D,G}}

function checks(c,set,p,r,fields){const out=[];const longs=fields.filter(f=>FIELD[f].type==='long');const text=longs.map(f=>r[f]||'').join('\n');if(!text.trim())return out;
  longs.forEach(f=>{const n=chars(r[f]),L=lim(c,f);if(n>L)out.push(['bad',`${FIELD[f].short}: ${n-L} character${n-L>1?'s':''} over the ${L}-character limit`])});
  const own=new Set([p.first,p.pref].filter(Boolean)),named=new Set();
  for(const q of roster(set)){if(q.id===p.id)continue;for(const n of[q.first,q.pref]){if(!n||own.has(n)||named.has(n))continue;if(reName(n).test(text)){named.add(n);out.push(['bad',`Mentions ${n}, another pupil in this group. Copy-paste slip?`])}}}
  if(p.pref&&reName(p.first).test(text))out.push(['warn',`Uses “${p.first}”, but ${p.first} goes by ${p.pref}`]);
  const wrong=p.sex==='F'?/\b(he|him|his|himself)\b/i:/\b(she|her|hers|herself)\b/i;const m=text.match(wrong);if(m)out.push(['bad',`Uses “${m[0]}”, but ${call(p)}'s pronouns are ${p.sex==='F'?'she/her':'he/him'}`]);
  if(/\[|\]|\bXX+\b|\?\?/.test(text))out.push(['bad','Looks like a placeholder is still in the text']);

document.addEventListener('paste',e=>{const t=e.target;if(!(t.classList&&t.classList.contains('gin')))return;const txt=(e.clipboardData||window.clipboardData).getData('text');if(!/[\t\n]/.test(txt.trim()))return;e.preventDefault();
  const c=CYC(state.cycle),set=SET[state.set],cols=gridCols(fieldsFor(c,set)),lines=txt.replace(/\r/g,'').replace(/\n$/,'').split('\n');const r0=Number(t.dataset.row),c0=cols.indexOf(t.dataset.f);let n=0;
  lines.forEach((ln,i)=>{const pid=set.ids[r0+i];if(!pid)return;ln.split('\t').forEach((cell,j)=>{const f=cols[c0+j];if(!f)return;const v=normField(f,FIELD[f].type==='num'?cell:cell);setVal(c,set,pid,f,v);const inp=document.querySelector(`.gin[data-pid="${pid}"][data-f="${f}"]`);if(inp)inp.value=v;n++});updateRow(pid)});
  save();toast(`Pasted ${n} value${n===1?'':'s'}`)});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#build').textContent='Last build: '+BUILD;
render();
}

</script>
</body>
